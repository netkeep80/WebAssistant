<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebAssistant — диагностика</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { width: 100%; box-sizing: border-box; padding: 24px; }
    h1 { margin: 0 0 4px; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    .muted { opacity: .7; }
    .grid { display: grid; gap: 16px; grid-template-columns: 1fr; width: 100%; }
    .card { width: 100%; box-sizing: border-box; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 10px; padding: 16px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, input, button { font: inherit; padding: 8px 10px; }
    select, input { min-width: 180px; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    a { color: LinkText; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin-bottom: 0; }
    dt { font-weight: 600; }
    dd { margin: 0; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow: auto; padding: 12px; border-radius: 6px; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    #pdf-result { margin-top: 12px; }
    #pdf-preview { width: 100%; min-height: 520px; margin-top: 12px; border: 1px solid color-mix(in srgb, CanvasText 22%, transparent); border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <header><h1>WebAssistant</h1><p class="muted">Локальная диагностическая панель</p></header>
    <div class="grid">
      <section class="card"><h2>Состояние службы</h2><p id="service-state">Проверка…</p><dl id="runtime-details" hidden><dt>Версия</dt><dd id="runtime-version">—</dd><dt>ОС</dt><dd id="runtime-os">—</dd><dt>Адрес</dt><dd id="runtime-listen">—</dd><dt>API</dt><dd id="runtime-api">—</dd><dt>Сканирование</dt><dd id="runtime-scan-state">—</dd></dl></section>
      <section class="card"><h2>Сканер</h2><div class="row"><select id="scanner-select" disabled><option value="">Поиск сканеров…</option></select><button id="refresh-scanners" type="button">Обновить</button></div><p id="scanner-status" class="muted"></p><div class="row"><button id="scan-button" type="button" disabled>Сканировать со стекла</button><button id="scan-feeder" type="button" disabled>Сканировать из ADF</button><button id="scan-duplex" type="button" disabled>Двустороннее из ADF</button></div><p id="scan-status"></p><div id="pdf-result" hidden><div class="row"><a id="pdf-download" download="scan.pdf">Сохранить PDF</a><a id="pdf-open" target="_blank" rel="noopener">Открыть PDF</a></div><object id="pdf-preview" type="application/pdf"></object></div></section>
      <section class="card"><h2>Журнал WebAssistant</h2><div class="row"><input id="log-date" type="date"><button id="read-log" type="button">Показать журнал</button></div><pre id="log-output">Выберите дату.</pre></section>
    </div>
  </main>
  <script>
    "use strict";
    const endpoints = Object.freeze({info:"/v1/diag/info",scanners:"/v1/scanners",scan:"/v1/scan",scanFeeder:"/v1/scan/feeder",scanDuplex:"/v1/scan/duplex",logs:"/v1/diag/logs"});
    const serviceState=document.getElementById("service-state"),runtimeDetails=document.getElementById("runtime-details"),scannerSelect=document.getElementById("scanner-select"),scannerStatus=document.getElementById("scanner-status"),scanButton=document.getElementById("scan-button"),scanFeederButton=document.getElementById("scan-feeder"),scanDuplexButton=document.getElementById("scan-duplex"),scanButtons=[scanButton,scanFeederButton,scanDuplexButton],scanStatus=document.getElementById("scan-status"),logDate=document.getElementById("log-date"),logOutput=document.getElementById("log-output"),pdfResult=document.getElementById("pdf-result"),pdfPreview=document.getElementById("pdf-preview"),pdfDownload=document.getElementById("pdf-download"),pdfOpen=document.getElementById("pdf-open");
    let pdfObjectUrl=null;
    function today(){const now=new Date(),local=new Date(now.getTime()-now.getTimezoneOffset()*60000);return local.toISOString().slice(0,10)}
    function setScanButtonsDisabled(disabled){for(const button of scanButtons)button.disabled=disabled}
    function releasePdfUrl(){if(pdfObjectUrl){URL.revokeObjectURL(pdfObjectUrl);pdfObjectUrl=null}}
    function showPdf(pdf){releasePdfUrl();pdfObjectUrl=URL.createObjectURL(pdf);pdfPreview.data=pdfObjectUrl;pdfDownload.href=pdfObjectUrl;pdfOpen.href=pdfObjectUrl;pdfResult.hidden=false}
    async function errorText(response){try{const problem=await response.clone().json();return problem.detail||problem.title||`HTTP ${response.status}`}catch{return `HTTP ${response.status}`}}
    async function refreshInfo(){try{const response=await fetch(endpoints.info,{cache:"no-store"});if(!response.ok)throw new Error(await errorText(response));const info=await response.json();serviceState.dataset.state="ok";serviceState.textContent="WebAssistant работает";document.getElementById("runtime-version").textContent=info.version;document.getElementById("runtime-os").textContent=info.os;document.getElementById("runtime-listen").textContent=info.listenUrl;document.getElementById("runtime-api").textContent=info.apiVersion;document.getElementById("runtime-scan-state").textContent=info.scanState;runtimeDetails.hidden=false}catch(error){serviceState.dataset.state="error";serviceState.textContent=`Ошибка диагностики: ${error.message}`}}
    async function refreshScanners(){scannerSelect.disabled=true;setScanButtonsDisabled(true);scannerStatus.textContent="Поиск сканеров…";try{const response=await fetch(endpoints.scanners,{cache:"no-store"});if(!response.ok)throw new Error(await errorText(response));const scanners=await response.json();scannerSelect.replaceChildren();for(const scanner of scanners){const option=document.createElement("option");option.value=scanner.id;option.textContent=scanner.name||scanner.id;scannerSelect.append(option)}if(scanners.length===0){scannerSelect.append(new Option("Сканеры не найдены",""));scannerStatus.textContent="Доступных сканеров нет.";return}scannerSelect.disabled=false;setScanButtonsDisabled(false);scannerStatus.textContent=`Обнаружено сканеров: ${scanners.length}`}catch(error){scannerSelect.replaceChildren(new Option("Ошибка обнаружения",""));scannerStatus.textContent=error.message}}
    async function scan(endpoint){const scannerId=scannerSelect.value;if(!scannerId)return;setScanButtonsDisabled(true);scanStatus.textContent="Сканирование…";try{const response=await fetch(`${endpoint}?scannerId=${encodeURIComponent(scannerId)}`,{method:"POST"});if(!response.ok)throw new Error(await errorText(response));const pdf=await response.blob();showPdf(pdf);scanStatus.textContent=`PDF получен: ${pdf.size} байт.`}catch(error){scanStatus.textContent=`Ошибка: ${error.message}`}finally{setScanButtonsDisabled(scannerSelect.disabled||!scannerSelect.value);await refreshInfo()}}
    async function readLog(){const date=logDate.value;if(!date)return;logOutput.textContent="Чтение журнала…";try{const response=await fetch(`${endpoints.logs}?date=${encodeURIComponent(date)}`,{cache:"no-store"});if(response.status===404){logOutput.textContent="Журнал за выбранную дату отсутствует.";return}if(!response.ok)throw new Error(await errorText(response));logOutput.textContent=await response.text()}catch(error){logOutput.textContent=`Ошибка: ${error.message}`}}
    document.getElementById("refresh-scanners").addEventListener("click",refreshScanners);scanButton.addEventListener("click",()=>scan(endpoints.scan));scanFeederButton.addEventListener("click",()=>scan(endpoints.scanFeeder));scanDuplexButton.addEventListener("click",()=>scan(endpoints.scanDuplex));document.getElementById("read-log").addEventListener("click",readLog);window.addEventListener("beforeunload",releasePdfUrl);logDate.value=today();void Promise.all([refreshInfo(),refreshScanners()]);
  </script>
</body>
</html>
