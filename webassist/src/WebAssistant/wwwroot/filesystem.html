<style>

<main>
<header><div><h1>Файлы WebAssistant</h1><p class="muted">Файлы передаются как недоверенные непрозрачные данные без встроенного просмотра.</p></div><a href="/">Диагностика</a></header>

<button id="filesystem-left-load-more" class="load-more" type="button" hidden>Показать ещё</button>
</section>
<div id="filesystem-splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Изменить ширину файловых панелей" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>
<section id="filesystem-right" class="panel" aria-label="Правая панель" tabindex="0">
<div class="panel-header"><h2>Правая панель</h2><div class="panel-header-actions"><button id="filesystem-right-move-selected" class="move-selected" type="button" disabled>Действия ←</button></div></div>
<nav id="filesystem-right-breadcrumb" class="breadcrumb" aria-label="Путь правой панели">—</nav>
<div class="filter-row"><label for="filesystem-right-wildcard">Маска</label><input id="filesystem-right-wildcard" class="wildcard" value="*.*" spellcheck="false"><button id="filesystem-right-apply-wildcard" type="button">Применить</button><button id="filesystem-right-zip" type="button">ZIP</button></div>
<div class="find-row"><textarea id="filesystem-right-find-names" class="find-names" placeholder="Точные имена, по одному в строке" aria-label="Точные имена файлов"></textarea><button id="filesystem-right-find" type="button">Найти</button></div>
<div class="toolbar"><button id="filesystem-right-create-file" type="button">Создать файл</button><button id="filesystem-right-create-directory" type="button">Создать каталог</button><button id="filesystem-right-upload" type="button">Загрузить файл</button><input id="filesystem-right-upload-input" class="upload-input" type="file" tabindex="-1" multiple><button id="filesystem-right-refresh" type="button">Обновить</button></div>
<p id="filesystem-right-status" class="panel-status muted"></p>
<div id="filesystem-right-table-wrap" class="table-wrap"><table><colgroup><col class="col-name"><col class="col-size"><col class="col-created"><col class="col-modified"><col class="col-restriction"><col class="col-actions"></colgroup><thead><tr><th data-sort-key="name" aria-sort="ascending"><button class="sort-button" type="button" data-sort-key="name">Имя <span class="sort-indicator">↑</span></button></th><th data-sort-key="size" aria-sort="none"><button class="sort-button" type="button" data-sort-key="size">Размер <span class="sort-indicator"></span></button></th><th data-sort-key="createdAt" aria-sort="none"><button class="sort-button" type="button" data-sort-key="createdAt">Создан <span class="sort-indicator"></span></button></th><th data-sort-key="lastModifiedAt" aria-sort="none"><button class="sort-button" type="button" data-sort-key="lastModifiedAt">Изменён <span class="sort-indicator"></span></button></th><th data-sort-key="restrictionCode" aria-sort="none"><button class="sort-button" type="button" data-sort-key="restrictionCode">Ограничение <span class="sort-indicator"></span></button></th><th>Действия</th></tr></thead><tbody id="filesystem-right-entries"></tbody></table></div>
<button id="filesystem-right-load-more" class="load-more" type="button" hidden>Показать ещё</button>
</section>
</div>
<script>
"use strict";
const api=Object.freeze({roots:"/v1/filesystem/roots",list:"/v1/filesystem/list",file:"/v1/filesystem/file",files:"/v1/filesystem/files",find:"/v1/filesystem/find",fileDelete:"/v1/filesystem/file/delete",directory:"/v1/filesystem/directory",directoryDelete:"/v1/filesystem/directory/delete",move:"/v1/filesystem/move",directoryMove:"/v1/filesystem/directory/move",rename:"/v1/filesystem/rename"});
const byId=id=>document.getElementById(id);
let activeRoot=null;
let configuredRoots=[];
let currentSide="left";
let internalDrag=null;
let splitRatio=.5;
const panels={left:createPanelState("left"),right:createPanelState("right")};
function createPanelState(side){return{side,relativePath:"",entries:[],nextCursor:null,sortKey:"name",sortDirection:"asc",currentRow:null,wildcard:"*.*",selectedNames:new Set(),selectionAnchor:null,findMarks:new Set(),generation:0,loading:false}}
const otherSide=side=>side==="left"?"right":"left";
const joinRelative=(base,name)=>base?`${base}/${name}`:name;
const parentRelative=path=>{const i=path.lastIndexOf("/");return i<0?"":path.slice(0,i)};
const logicalPath=(root,relative)=>relative?`${root}/${relative}`:`${root}/`;
const dirPath=side=>logicalPath(activeRoot,panels[side].relativePath);
function urlWithPath(url,path,params={}){const q=new URLSearchParams({path});for(const[key,value]of Object.entries(params)){if(value!==null&&value!==undefined)q.append(key,String(value))}return`${url}?${q.toString()}`}
async function problem(response){try{const p=await response.json();return{code:p.code||`http_${response.status}`,message:p.title||`HTTP ${response.status}`}}catch{return{code:`http_${response.status}`,message:`HTTP ${response.status}`}}}
async function requireOk(responseOrPromise){const response=await responseOrPromise;if(response.ok)return response;const p=await problem(response);const e=new Error(p.message);e.code=p.code;throw e}
function friendly(error){const names={filesystem_not_configured:"Файловая подсистема не настроена",filesystem_configuration_invalid:"Конфигурация файловой подсистемы некорректна",filesystem_root_not_found:"Логический корень не найден",filesystem_root_unavailable:"Логический корень временно недоступен",filesystem_path_invalid:"Недопустимый путь",destination_exists:"Объект с таким именем уже существует",directory_not_empty:"Каталог не пуст",blocked_file_type:"Этот тип файла запрещён",locked:"Объект заблокирован другой программой",not_found:"Объект больше не существует",unsafe_link:"Операция со ссылкой запрещена",hardlink_rejected:"Операция с hard link запрещена"};return names[error.code]||error.message||String(error)}
function showPanelStatus(side,text,state="ok"){const node=byId(`filesystem-${side}-status`);node.textContent=text;node.dataset.state=state}
function showError(side,error){const code=error&&error.code?` (${error.code})`:"";const text=`${friendly(error)}${code}`;showPanelStatus(side,text,"error");setGlobal(text,"error")}
function setGlobal(text,state="ok"){const node=byId("filesystem-status");node.textContent=text;node.dataset.state=state}
function clearDropClasses(){for(const side of["left","right"])byId(`filesystem-${side}`).classList.remove("drop-target","drop-forbidden")}
function resetTransientDragState(){internalDrag=null;clearDropClasses()}
function isSelectable(entry){return entry&&entry.kind==="file"&&!entry.restrictionCode}
function isMutable(entry){return entry&&(entry.kind==="file"||entry.kind==="directory")&&!entry.restrictionCode}
function clearSelection(side){const state=panels[side];state.selectedNames.clear();state.selectionAnchor=null;state.findMarks.clear();updateMoveButtons()}
function reconcileSelection(side){const state=panels[side];const eligible=new Set(state.entries.filter(isSelectable).map(entry=>entry.name));const surviving=new Set([...state.selectedNames].filter(name=>eligible.has(name)));state.selectedNames=surviving;if(state.selectionAnchor&&!eligible.has(state.selectionAnchor))state.selectionAnchor=null;state.findMarks=new Set([...state.findMarks].filter(name=>eligible.has(name)))}
function sameDirectory(a,b){return activeRoot!==null&&panels[a].relativePath===panels[b].relativePath}
function updateMoveButtons(){for(const side of["left","right"]){const state=panels[side];byId(`filesystem-${side}-move-selected`).disabled=!activeRoot||state.selectedNames.size===0||sameDirectory(side,otherSide(side))||state.loading}}
function iconFor(entry){if(entry.restrictionCode)return"icon-restricted";if(entry.kind==="directory")return"icon-folder";if(entry.kind==="link")return"icon-link";return"icon-file"}
function esc(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function formatSize(value){if(value===null||value===undefined)return"—";if(value<1024)return`${value} Б`;const units=["КБ","МБ","ГБ","ТБ"];let n=value/1024;let i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return`${n.toFixed(n>=10?1:2)} ${units[i]}`}
function formatDate(value){if(!value)return"—";const d=new Date(value);return Number.isNaN(d.getTime())?"—":d.toLocaleString("ru-RU")}
function compareValues(a,b,key){if(key==="size")return(a.size??-1)-(b.size??-1);if(key==="createdAt"||key==="lastModifiedAt")return String(a[key]??"").localeCompare(String(b[key]??""));return String(a[key]??"").localeCompare(String(b[key]??""),"ru",{sensitivity:"base",numeric:true})}
function sortedEntries(side){const state=panels[side];return[...state.entries].sort((a,b)=>{const kind=a.kind===b.kind?0:a.kind==="directory"?-1:b.kind==="directory"?1:0;const primary=state.sortKey==="name"&&kind!==0?kind:compareValues(a,b,state.sortKey);if(primary!==0)return state.sortDirection==="asc"?primary:-primary;return state.sortKey==="name"?0:compareValues(a,b,"name")})}
function renderBreadcrumb(side){const state=panels[side];const node=byId(`filesystem-${side}-breadcrumb`);node.replaceChildren();if(!activeRoot){node.textContent="—";return}const rootButton=document.createElement("button");rootButton.type="button";rootButton.dataset.path=`${activeRoot}/`;rootButton.textContent=activeRoot;rootButton.addEventListener("click",()=>navigate(side,""));node.append(rootButton);let current="";for(const part of state.relativePath.split("/").filter(Boolean)){node.append(document.createTextNode(" / "));current=joinRelative(current,part);const button=document.createElement("button");button.type="button";button.dataset.path=logicalPath(activeRoot,current);button.textContent=part;const target=current;button.addEventListener("click",()=>navigate(side,target));node.append(button)}}
function renderSortHeaders(side){const panel=byId(`filesystem-${side}`);const state=panels[side];for(const th of panel.querySelectorAll("thead th[data-sort-key]")){const key=th.dataset.sortKey;const active=key===state.sortKey;th.setAttribute("aria-sort",active?(state.sortDirection==="asc"?"ascending":"descending"):"none");const indicator=th.querySelector(".sort-indicator");if(indicator)indicator.textContent=active?(state.sortDirection==="asc"?"↑":"↓"):""}}
function createAction(label,title,action){const button=document.createElement("button");button.type="button";button.textContent=label;button.title=title;button.dataset.action=action;return button}
function parentRow(side){const tr=document.createElement("tr");tr.className="parent-row";tr.dataset.parentRow="true";tr.dataset.entryName="..";tr.dataset.selectionId=`${dirPath(side)}..`;const td=document.createElement("td");const open=document.createElement("button");open.type="button";open.className="entry-open";open.dataset.entryOpen="";open.innerHTML='<svg class="entry-icon" aria-hidden="true"><use href="#icon-folder"></use></svg><span>..</span>';open.addEventListener("click",event=>{event.stopPropagation();navigate(side,parentRelative(panels[side].relativePath))});td.append(open);tr.append(td);for(let i=0;i<4;i++){const empty=document.createElement("td");empty.textContent="—";tr.append(empty)}tr.append(document.createElement("td"));tr.addEventListener("click",()=>setCurrentRow(side,".."));return tr}
function entryRow(side,entry){const state=panels[side];const tr=document.createElement("tr");tr.dataset.entryName=entry.name;tr.dataset.selectionId=logicalPath(activeRoot,joinRelative(state.relativePath,entry.name));tr.classList.add(`entry-kind-${entry.kind}`);if(entry.restrictionCode)tr.classList.add("entry-restricted");if(state.currentRow===entry.name)tr.classList.add("current-row");if(state.selectedNames.has(entry.name))tr.classList.add("selected-row");if(state.findMarks.has(entry.name))tr.classList.add("find-mark");const name=document.createElement("td");const open=document.createElement("button");open.type="button";open.className="entry-open";open.dataset.entryOpen="";open.disabled=entry.kind==="link"||!!entry.restrictionCode;open.innerHTML=`<svg class="entry-icon" aria-hidden="true"><use href="#${iconFor(entry)}"></use></svg><span>${esc(entry.name)}</span>`;open.addEventListener("click",event=>{event.stopPropagation();openEntry(side,entry)});name.append(open);tr.append(name);for(const text of[formatSize(entry.size),formatDate(entry.createdAt),formatDate(entry.lastModifiedAt),entry.restrictionCode||"—"]){const td=document.createElement("td");td.textContent=text;if(text===entry.restrictionCode&&entry.restrictionCode)td.className="restriction";tr.append(td)}const actions=document.createElement("td");actions.className="actions";if(isMutable(entry)){const move=createAction(side==="left"?"→":"←","Переместить","move");move.addEventListener("click",event=>{event.stopPropagation();entry.kind==="directory"?moveDirectory(side,entry.name):moveOneFile(side,entry.name)});const rename=createAction("✎","Переименовать","rename");rename.addEventListener("click",event=>{event.stopPropagation();renameEntry(side,entry)});const remove=createAction("×","Удалить","delete");remove.addEventListener("click",event=>{event.stopPropagation();deleteEntry(side,entry)});actions.append(move,rename,remove)}tr.append(actions);tr.addEventListener("click",event=>handleRowSelection(side,entry,event));if(isMutable(entry)){tr.draggable=true;tr.addEventListener("dragstart",event=>beginInternalDrag(side,entry,event));tr.addEventListener("dragend",()=>{internalDrag=null;tr.classList.remove("dragging-row")})}return tr}
function renderPanel(side){const state=panels[side];renderBreadcrumb(side);renderSortHeaders(side);const body=byId(`filesystem-${side}-entries`);body.replaceChildren();if(activeRoot&&state.relativePath)body.append(parentRow(side));for(const entry of sortedEntries(side))body.append(entryRow(side,entry));const more=byId(`filesystem-${side}-load-more`);more.hidden=!state.nextCursor;more.disabled=state.loading;byId(`filesystem-${side}-wildcard`).value=state.wildcard;updateMoveButtons()}
function setCurrentSide(side){currentSide=side;for(const name of["left","right"])byId(`filesystem-${name}`).classList.toggle("current-panel",name===side)}
function setCurrentRow(side,name){panels[side].currentRow=name;setCurrentSide(side);byId(`filesystem-${side}`).focus({preventScroll:true});renderPanel(side)}
function handleRowSelection(side,entry,event){setCurrentSide(side);byId(`filesystem-${side}`).focus({preventScroll:true});const state=panels[side];state.currentRow=entry.name;if(!isSelectable(entry)){renderPanel(side);return}const visible=sortedEntries(side).filter(isSelectable).map(item=>item.name);if(event.shiftKey&&state.selectionAnchor&&visible.includes(state.selectionAnchor)){const a=visible.indexOf(state.selectionAnchor);const b=visible.indexOf(entry.name);const from=Math.min(a,b);const to=Math.max(a,b);if(!(event.ctrlKey||event.metaKey))state.selectedNames.clear();for(let i=from;i<=to;i++)state.selectedNames.add(visible[i])}else if(event.ctrlKey||event.metaKey){if(state.selectedNames.has(entry.name))state.selectedNames.delete(entry.name);else state.selectedNames.add(entry.name);if(!state.selectionAnchor)state.selectionAnchor=entry.name}else{state.selectedNames.clear();state.selectedNames.add(entry.name);state.selectionAnchor=entry.name}state.findMarks.delete(entry.name);renderPanel(side)}
function setSort(side,key){const state=panels[side];if(state.sortKey===key)state.sortDirection=state.sortDirection==="asc"?"desc":"asc";else{state.sortKey=key;state.sortDirection="asc"}renderPanel(side)}
async function listPage(side,cursor=null){const state=panels[side];const params={wildcard:state.wildcard,limit:200};if(cursor)params.cursor=cursor;const response=await requireOk(fetch(urlWithPath(api.list,dirPath(side),params)));return response.json()}
async function refreshPanel(side,{resetSelection=false}={}){const state=panels[side];if(!activeRoot)return;const generation=++state.generation;state.loading=true;if(resetSelection)clearSelection(side);showPanelStatus(side,"Загрузка…");updateMoveButtons();try{const data=await listPage(side);if(generation!==state.generation)return;state.entries=Array.isArray(data.entries)?data.entries:[];state.nextCursor=data.nextCursor||null;reconcileSelection(side);if(state.currentRow&&state.currentRow!==".."&&!state.entries.some(entry=>entry.name===state.currentRow))state.currentRow=null;showPanelStatus(side,`${state.entries.length} объектов; выбрано: ${state.selectedNames.size}`);renderPanel(side)}catch(error){if(generation!==state.generation)return;state.entries=[];state.nextCursor=null;reconcileSelection(side);showError(side,error);renderPanel(side)}finally{if(generation===state.generation){state.loading=false;renderPanel(side)}}}
async function loadMore(side){const state=panels[side];if(!state.nextCursor||state.loading)return;const generation=state.generation;state.loading=true;try{const data=await listPage(side,state.nextCursor);if(generation!==state.generation)return;const known=new Set(state.entries.map(entry=>entry.name));for(const entry of data.entries||[])if(!known.has(entry.name))state.entries.push(entry);state.nextCursor=data.nextCursor||null;reconcileSelection(side);showPanelStatus(side,`${state.entries.length} объектов; выбрано: ${state.selectedNames.size}`);renderPanel(side)}catch(error){showError(side,error)}finally{state.loading=false;renderPanel(side)}}
async function navigate(side,relative){const state=panels[side];if(relative===state.relativePath)return;state.relativePath=relative;state.currentRow=null;clearSelection(side);await refreshPanel(side,{resetSelection:false})}
async function selectRoot(root){resetTransientDragState();activeRoot=root;for(const button of byId("filesystem-roots").querySelectorAll(".root-button"))button.classList.toggle("active",button.dataset.root===root);for(const side of["left","right"]){const state=panels[side];state.relativePath="";state.currentRow=null;state.wildcard="*.*";byId(`filesystem-${side}-find-names`).value="";clearSelection(side)}await Promise.all([refreshPanel("left"),refreshPanel("right")])}
async function loadRoots(){try{const response=await requireOk(fetch(api.roots));const data=await response.json();configuredRoots=Array.isArray(data.roots)?data.roots:[];const nav=byId("filesystem-roots");nav.replaceChildren();for(const root of configuredRoots){const button=document.createElement("button");button.type="button";button.className="root-button";button.dataset.root=root;button.textContent=root;button.addEventListener("click",()=>selectRoot(root));nav.append(button)}if(configuredRoots.length===0){setGlobal("Логические корни не настроены","error");return}setGlobal(`${configuredRoots.length} логических корней`);await selectRoot(configuredRoots[0])}catch(error){setGlobal(`${friendly(error)}${error.code?` (${error.code})`:""}`,"error")}}
async function openEntry(side,entry){if(entry.restrictionCode||entry.kind==="link")return;if(entry.kind==="directory"){await navigate(side,joinRelative(panels[side].relativePath,entry.name));return}if(entry.kind==="file")downloadFile(side,entry.name)}
function triggerDownload(url,fileName){const anchor=document.createElement("a");anchor.href=url;anchor.download=fileName;anchor.hidden=true;document.body.append(anchor);anchor.click();anchor.remove()}
function downloadFile(side,name){triggerDownload(urlWithPath(api.file,logicalPath(activeRoot,joinRelative(panels[side].relativePath,name))),name)}
function downloadZip(side){const state=panels[side];triggerDownload(urlWithPath(api.files,dirPath(side),{wildcard:state.wildcard}),`${activeRoot}-${state.relativePath.split("/").filter(Boolean).pop()||"root"}.zip`)}
async function applyWildcard(side){const state=panels[side];state.wildcard=byId(`filesystem-${side}-wildcard`).value;state.findMarks.clear();await refreshPanel(side)}
function requestedFindNames(side){const seen=new Set();const result=[];for(const raw of byId(`filesystem-${side}-find-names`).value.split(/\r?\n/)){const name=raw.trim();if(name&&!seen.has(name)){seen.add(name);result.push(name)}}return result}
async function findNames(side){const names=requestedFindNames(side);if(names.length===0){showPanelStatus(side,"Введите хотя бы одно имя","error");return}const params=new URLSearchParams({path:dirPath(side)});for(const name of names)params.append("name",name);try{const response=await requireOk(fetch(`${api.find}?${params.toString()}`));const data=await response.json();const found=Array.isArray(data.fileNames)?data.fileNames:[];const loadedEligible=new Set(panels[side].entries.filter(isSelectable).map(entry=>entry.name));panels[side].findMarks=new Set(found.filter(name=>loadedEligible.has(name)));for(const name of found)if(loadedEligible.has(name))panels[side].selectedNames.add(name);showPanelStatus(side,`Найдено: ${found.length}; выбрано: ${panels[side].selectedNames.size}`);renderPanel(side)}catch(error){showError(side,error)}}
async function postJson(url,value){return requireOk(fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(value)}))}
async function createEmptyFile(side){const name=prompt("Имя нового файла:");if(!name)return;try{await requireOk(fetch(urlWithPath(api.file,logicalPath(activeRoot,joinRelative(panels[side].relativePath,name))),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:new Uint8Array()}));await refreshPanel(side)}catch(error){showError(side,error)}}
async function createDirectory(side){const name=prompt("Имя нового каталога:");if(!name)return;try{await postJson(api.directory,{path:logicalPath(activeRoot,joinRelative(panels[side].relativePath,name))});await refreshPanel(side)}catch(error){showError(side,error)}}
async function uploadFiles(side,files){for(const file of files){try{const path=logicalPath(activeRoot,joinRelative(panels[side].relativePath,file.name));await requireOk(fetch(urlWithPath(api.file,path),{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:file}))}catch(error){showError(side,error);return}}await refreshPanel(side)}
async function deleteEntry(side,entry){if(!isMutable(entry)||!confirm(`Удалить «${entry.name}»?`))return;const path=logicalPath(activeRoot,joinRelative(panels[side].relativePath,entry.name));try{const endpoint=entry.kind==="directory"?api.directoryDelete:api.fileDelete;await requireOk(fetch(urlWithPath(endpoint,path),{method:"POST"}));panels[side].selectedNames.delete(entry.name);await refreshPanel(side)}catch(error){showError(side,error)}}
async function renameEntry(side,entry){if(!isMutable(entry))return;const newName=prompt("Новое имя:",entry.name);if(!newName||newName===entry.name)return;const path=logicalPath(activeRoot,joinRelative(panels[side].relativePath,entry.name));try{await postJson(api.rename,{path,newName});panels[side].selectedNames.delete(entry.name);panels[side].currentRow=newName;await refreshPanel(side)}catch(error){showError(side,error)}}
function selectedInDisplayOrder(side){const state=panels[side];return sortedEntries(side).filter(entry=>state.selectedNames.has(entry.name)&&isSelectable(entry)).map(entry=>entry.name)}
async function performFileMove(side,fileNames){const target=otherSide(side);if(fileNames.length===0||sameDirectory(side,target))return;const payload={sourcePath:dirPath(side),destinationPath:dirPath(target),fileNames};try{const response=await postJson(api.move,payload);const data=await response.json();const moved=Array.isArray(data.fileNames)?data.fileNames:[];for(const name of moved)panels[side].selectedNames.delete(name);showPanelStatus(side,`Перемещено: ${moved.length}`);await Promise.all([refreshPanel(side),refreshPanel(target)])}catch(error){showError(side,error);await Promise.all([refreshPanel(side),refreshPanel(target)])}}
async function moveSelected(side){await performFileMove(side,selectedInDisplayOrder(side))}
async function moveOneFile(side,name){await performFileMove(side,[name])}
async function moveDirectory(side,name){const target=otherSide(side);if(sameDirectory(side,target))return;const sourcePath=logicalPath(activeRoot,joinRelative(panels[side].relativePath,name));try{await postJson(api.directoryMove,{sourcePath,destinationPath:dirPath(target)});await Promise.all([refreshPanel(side),refreshPanel(target)])}catch(error){showError(side,error);await Promise.all([refreshPanel(side),refreshPanel(target)])}}
function beginInternalDrag(side,entry,event){if(!isMutable(entry))return;setCurrentSide(side);let fileNames=null;if(entry.kind==="file"){fileNames=panels[side].selectedNames.has(entry.name)?selectedInDisplayOrder(side):[entry.name]}internalDrag={side,kind:entry.kind,name:entry.name,fileNames};event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",entry.name);event.currentTarget.classList.add("dragging-row")}
async function dropOnPanel(targetSide,event){event.preventDefault();const panel=byId(`filesystem-${targetSide}`);panel.classList.remove("drop-target","drop-forbidden");if(event.dataTransfer.files&&event.dataTransfer.files.length){await uploadFiles(targetSide,[...event.dataTransfer.files]);return}if(!internalDrag)return;const source=internalDrag.side;if(source===targetSide||sameDirectory(source,targetSide)){internalDrag=null;return}const drag=internalDrag;internalDrag=null;if(drag.kind==="directory")await moveDirectory(source,drag.name);else await performFileMove(source,drag.fileNames||[drag.name])}
function keyboardRows(side){return[...byId(`filesystem-${side}-entries`).querySelectorAll("tr[data-entry-name]")].map(row=>row.dataset.entryName)}
function keyboardMove(side,delta){const names=keyboardRows(side);if(names.length===0)return;const state=panels[side];let index=names.indexOf(state.currentRow);if(index<0)index=delta>0?-1:0;index=Math.max(0,Math.min(names.length-1,index+delta));state.currentRow=names[index];renderPanel(side);const row=byId(`filesystem-${side}-entries`).querySelector(`tr[data-entry-name="${CSS.escape(state.currentRow)}"]`);if(row)row.scrollIntoView({block:"nearest"})}
function keyboardOpen(side){const name=panels[side].currentRow;if(!name)return;if(name===".."){navigate(side,parentRelative(panels[side].relativePath));return}const entry=panels[side].entries.find(item=>item.name===name);if(entry)openEntry(side,entry)}
function wirePanel(side){const panel=byId(`filesystem-${side}`);panel.addEventListener("pointerdown",()=>setCurrentSide(side));panel.addEventListener("keydown",event=>{if(event.target.matches("input,textarea,button,a"))return;if(event.key==="ArrowUp"){event.preventDefault();keyboardMove(side,-1)}else if(event.key==="ArrowDown"){event.preventDefault();keyboardMove(side,1)}else if(event.key==="Enter"){event.preventDefault();keyboardOpen(side)}else if(event.key==="Tab"){event.preventDefault();const target=otherSide(side);setCurrentSide(target);byId(`filesystem-${target}`).focus()}});for(const button of panel.querySelectorAll("thead .sort-button"))button.addEventListener("click",()=>setSort(side,button.dataset.sortKey));byId(`filesystem-${side}-refresh`).addEventListener("click",()=>refreshPanel(side));byId(`filesystem-${side}-load-more`).addEventListener("click",()=>loadMore(side));byId(`filesystem-${side}-create-file`).addEventListener("click",()=>createEmptyFile(side));byId(`filesystem-${side}-create-directory`).addEventListener("click",()=>createDirectory(side));byId(`filesystem-${side}-move-selected`).addEventListener("click",()=>moveSelected(side));byId(`filesystem-${side}-apply-wildcard`).addEventListener("click",()=>applyWildcard(side));byId(`filesystem-${side}-wildcard`).addEventListener("keydown",event=>{if(event.key==="Enter")applyWildcard(side)});byId(`filesystem-${side}-zip`).addEventListener("click",()=>downloadZip(side));byId(`filesystem-${side}-find`).addEventListener("click",()=>findNames(side));const input=byId(`filesystem-${side}-upload-input`);byId(`filesystem-${side}-upload`).addEventListener("click",()=>{if(input.showPicker)input.showPicker();else input.click()});input.addEventListener("change",async()=>{const files=[...input.files];input.value="";if(files.length)await uploadFiles(side,files)});panel.addEventListener("dragover",event=>{event.preventDefault();const forbidden=internalDrag&&(internalDrag.side===side||sameDirectory(internalDrag.side,side));panel.classList.toggle("drop-forbidden",!!forbidden);panel.classList.toggle("drop-target",!forbidden);event.dataTransfer.dropEffect=forbidden?"none":internalDrag?"move":"copy"});panel.addEventListener("dragleave",event=>{if(!panel.contains(event.relatedTarget))panel.classList.remove("drop-target","drop-forbidden")});panel.addEventListener("drop",event=>dropOnPanel(side,event))}
function minimumPanelWidth(total){return Math.min(380,Math.max(220,(total-byId("filesystem-splitter").offsetWidth)/2))}
function wireSplitter(){const splitter=byId("filesystem-splitter");const container=byId("filesystem-panels");const apply=ratio=>{const available=Math.max(0,container.clientWidth-splitter.offsetWidth);if(!available)return;const min=minimumPanelWidth(container.clientWidth);const low=Math.min(.5,min/available);const high=1-low;splitRatio=Math.max(low,Math.min(high,ratio));const leftWidth=Math.round(available*splitRatio);byId("filesystem-left").style.flex=`0 0 ${leftWidth}px`;byId("filesystem-right").style.flex="1 1 0";splitter.setAttribute("aria-valuenow",String(Math.round(splitRatio*100)))};const fromPointer=event=>{const rect=container.getBoundingClientRect();const available=rect.width-splitter.offsetWidth;if(available>0)apply((event.clientX-rect.left)/available)};let pointerId=null;splitter.addEventListener("pointerdown",event=>{pointerId=event.pointerId;splitter.setPointerCapture(pointerId);splitter.classList.add("dragging");fromPointer(event);event.preventDefault()});splitter.addEventListener("pointermove",event=>{if(pointerId===event.pointerId)fromPointer(event)});const stop=event=>{if(pointerId===null)return;if(event&&event.pointerId!==pointerId)return;if(splitter.hasPointerCapture(pointerId))splitter.releasePointerCapture(pointerId);pointerId=null;splitter.classList.remove("dragging")};splitter.addEventListener("pointerup",stop);splitter.addEventListener("pointercancel",stop);splitter.addEventListener("keydown",event=>{if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;event.preventDefault();apply(splitRatio+(event.key==="ArrowRight"?.03:-.03))});window.addEventListener("resize",()=>apply(splitRatio));apply(splitRatio)}
wirePanel("left");wirePanel("right");wireSplitter();loadRoots();
</script>
</body>
