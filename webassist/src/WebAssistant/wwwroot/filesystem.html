<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebAssistant — файлы</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:Canvas;color:CanvasText}main{padding:20px;max-width:1800px;margin:0 auto}header,.roots,.toolbar,.sortbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:12px}h1,h2{margin:.2em 0}p{margin:.35em 0}.muted{opacity:.72}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.roots{padding:10px 0 14px}.root-button{padding:7px 14px;border:1px solid color-mix(in srgb,CanvasText 30%,transparent);border-radius:8px;background:Canvas}.root-button.active{font-weight:700;outline:2px solid LinkText;outline-offset:1px}.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.panel{min-width:0;border:1px solid color-mix(in srgb,CanvasText 24%,transparent);border-radius:10px;padding:12px;background:color-mix(in srgb,Canvas 96%,CanvasText 4%)}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.breadcrumb{min-height:32px;padding:5px 0;display:block}.breadcrumb button{display:inline;border:0;background:none;color:LinkText;text-decoration:underline;padding:2px 3px}.toolbar{margin:5px 0}.toolbar button,.sortbar button,.sortbar select{padding:6px 8px}.sortbar{margin-left:auto}.upload-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.panel-status{min-height:1.4em;margin:6px 0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid color-mix(in srgb,CanvasText 16%,transparent);vertical-align:middle;white-space:nowrap}th:first-child,td:first-child{min-width:180px}.entry-open{display:inline-flex;gap:7px;align-items:center;border:0;background:none;padding:3px 4px;color:inherit;text-align:left;font:inherit}.entry-open:not(:disabled):hover,.entry-open:not(:disabled):focus-visible{text-decoration:underline;background:color-mix(in srgb,LinkText 10%,transparent);border-radius:5px}.entry-icon{width:18px;height:18px;flex:0 0 18px}.entry-kind-directory .entry-open{color:LinkText;font-weight:600}.entry-kind-file .entry-open{color:CanvasText}.entry-kind-link,.entry-restricted{opacity:.67}.entry-restricted .entry-open{font-style:italic}.parent-row .entry-open{font-weight:700;color:LinkText}.actions{justify-content:flex-end;flex-wrap:nowrap}.actions button{width:30px;height:30px;padding:2px;border-radius:6px}.restriction{white-space:normal;max-width:140px}.load-more{margin-top:8px}.global-status{min-height:1.5em;margin:4px 0 12px}.global-status[data-state=error],.panel-status[data-state=error]{font-weight:600}.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}@media(max-width:1050px){.panels{grid-template-columns:1fr}.sortbar{margin-left:0}}
</style>
</head>
<body>
<svg class="icon-sprite" aria-hidden="true" focusable="false">
<symbol id="icon-folder" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h7l2 2h9v12H3z"/></symbol>
<symbol id="icon-file" viewBox="0 0 24 24"><path fill="currentColor" d="M5 2h9l5 5v15H5zm9 2v5h5"/></symbol>
<symbol id="icon-restricted" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m5.7 4.9L6.9 17.7A8 8 0 0 1 17.7 6.9M6.3 17.1A8 8 0 0 1 17.1 6.3z"/></symbol>
<symbol id="icon-link" viewBox="0 0 24 24"><path fill="currentColor" d="M8.5 14.5 5 18a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0l1 1-1.5 1.5-1-1a1.5 1.5 0 0 0-2 0l-4 4a1.5 1.5 0 1 0 2 2L7 13zm7-5L19 6a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0l-1-1 1.5-1.5 1 1a1.5 1.5 0 1 0 2-2L17 11zM7 11h10v2H7z"/></symbol>
</svg>
<main>
<header><div><h1>Файлы WebAssistant</h1><p class="muted">Файлы передаются как недоверенные непрозрачные данные без встроенного просмотра.</p></div><a href="/">Диагностика</a></header>
<nav id="filesystem-roots" class="roots" aria-label="Логические корни"></nav>
<p id="filesystem-status" class="global-status muted">Загрузка списка корней…</p>
<div class="panels">
<section id="filesystem-left" class="panel" aria-label="Левая панель">
<div class="panel-header"><h2>Левая панель</h2></div>
<nav id="filesystem-left-breadcrumb" class="breadcrumb" aria-label="Путь левой панели">—</nav>
<div class="toolbar">
<button id="filesystem-left-create-file" type="button">Создать файл</button>
<button id="filesystem-left-create-directory" type="button">Создать каталог</button>
<button id="filesystem-left-upload" type="button">Загрузить файл</button>
<input id="filesystem-left-upload-input" class="upload-input" type="file" tabindex="-1">
<button id="filesystem-left-refresh" type="button">Обновить</button>
<div class="sortbar"><label>Сортировка <select id="filesystem-left-sort-key"><option value="name">Имя</option><option value="kind">Вид</option><option value="size">Размер</option><option value="lastModifiedAt">Изменён</option></select></label><button id="filesystem-left-sort-direction" type="button" title="Изменить направление сортировки" aria-label="Изменить направление сортировки">↑</button></div>
</div>
<p id="filesystem-left-status" class="panel-status muted"></p>
<div class="table-wrap"><table><thead><tr><th>Имя</th><th>Размер</th><th>Создан</th><th>Изменён</th><th>Ограничение</th><th>Действия</th></tr></thead><tbody id="filesystem-left-entries"></tbody></table></div>
<button id="filesystem-left-load-more" class="load-more" type="button" hidden>Показать ещё</button>
</section>
<section id="filesystem-right" class="panel" aria-label="Правая панель">
<div class="panel-header"><h2>Правая панель</h2></div>
<nav id="filesystem-right-breadcrumb" class="breadcrumb" aria-label="Путь правой панели">—</nav>
<div class="toolbar">
<button id="filesystem-right-create-file" type="button">Создать файл</button>
<button id="filesystem-right-create-directory" type="button">Создать каталог</button>
<button id="filesystem-right-upload" type="button">Загрузить файл</button>
<input id="filesystem-right-upload-input" class="upload-input" type="file" tabindex="-1">
<button id="filesystem-right-refresh" type="button">Обновить</button>
<div class="sortbar"><label>Сортировка <select id="filesystem-right-sort-key"><option value="name">Имя</option><option value="kind">Вид</option><option value="size">Размер</option><option value="lastModifiedAt">Изменён</option></select></label><button id="filesystem-right-sort-direction" type="button" title="Изменить направление сортировки" aria-label="Изменить направление сортировки">↑</button></div>
</div>
<p id="filesystem-right-status" class="panel-status muted"></p>
<div class="table-wrap"><table><thead><tr><th>Имя</th><th>Размер</th><th>Создан</th><th>Изменён</th><th>Ограничение</th><th>Действия</th></tr></thead><tbody id="filesystem-right-entries"></tbody></table></div>
<button id="filesystem-right-load-more" class="load-more" type="button" hidden>Показать ещё</button>
</section>
</div>
<script>
"use strict";
const api=Object.freeze({roots:"/v1/filesystem/roots",list:"/v1/filesystem/list",file:"/v1/filesystem/file",directory:"/v1/filesystem/directory",move:"/v1/filesystem/move"});
const byId=id=>document.getElementById(id);let activeRoot=null;let configuredRoots=[];
const panels={left:createPanelState("left"),right:createPanelState("right")};
function createPanelState(side){return{side,relativePath:"",entries:[],nextCursor:null,sortKey:"name",sortDirection:"asc",generation:0,loading:false}}
const otherSide=side=>side==="left"?"right":"left";const joinRelative=(base,name)=>base?`${base}/${name}`:name;const parentRelative=path=>{const i=path.lastIndexOf("/");return i<0?"":path.slice(0,i)};const logicalPath=(root,relative)=>relative?`${root}/${relative}`:`${root}/`;const query=(url,path,extra="")=>`${url}?path=${encodeURIComponent(path)}${extra}`;
async function problem(response){try{const p=await response.json();return{code:p.code||`http_${response.status}`,message:p.title||`HTTP ${response.status}`}}catch{return{code:`http_${response.status}`,message:`HTTP ${response.status}`}}}
async function requireOk(response){if(response.ok)return response;const p=await problem(response);const e=new Error(p.message);e.code=p.code;throw e}
function friendly(error){const names={filesystem_not_configured:"Файловая подсистема не настроена",filesystem_configuration_invalid:"Конфигурация файловой подсистемы некорректна",filesystem_root_not_found:"Логический корень не найден",filesystem_root_unavailable:"Логический корень временно недоступен",filesystem_path_invalid:"Недопустимый путь",destination_exists:"Объект с таким именем уже существует",directory_not_empty:"Каталог не пуст",blocked_file_type:"Этот тип файла запрещён",locked:"Объект заблокирован другой программой",not_found:"Объект больше не существует",unsafe_link:"Операция со ссылкой запрещена",hardlink_rejected:"Операция с hard-link запрещена"};return `${names[error.code]||error.message||"Ошибка"} (${error.code||"network_error"})`}
function setStatus(text,error=false){const el=byId("filesystem-status");el.textContent=text;el.dataset.state=error?"error":"ok"}function setPanelStatus(side,text,error=false){const el=byId(`filesystem-${side}-status`);el.textContent=text;el.dataset.state=error?"error":"ok"}function fmt(value){return value?new Date(value).toLocaleString():"—"}function fmtSize(value){return value==null?"—":`${value} байт`}
function renderRootButtons(){const nav=byId("filesystem-roots");nav.replaceChildren();for(const root of configuredRoots){const button=document.createElement("button");button.type="button";button.className="root-button"+(root===activeRoot?" active":"");button.dataset.root=root;button.textContent=root;button.setAttribute("aria-pressed",root===activeRoot?"true":"false");button.onclick=()=>selectRoot(root);nav.append(button)}}
function renderBreadcrumb(side){const state=panels[side],nav=byId(`filesystem-${side}-breadcrumb`);nav.replaceChildren();if(!activeRoot){nav.textContent="—";return}const rootButton=document.createElement("button");rootButton.type="button";rootButton.textContent=activeRoot;rootButton.dataset.path=logicalPath(activeRoot,"");rootButton.onclick=()=>navigate(side,"");nav.append(rootButton);let built="";for(const part of state.relativePath?state.relativePath.split("/"):[]){nav.append(document.createTextNode(" / "));built=joinRelative(built,part);const target=built,button=document.createElement("button");button.type="button";button.textContent=part;button.dataset.path=logicalPath(activeRoot,target);button.onclick=()=>navigate(side,target);nav.append(button)}}
function iconElement(id){const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","entry-icon");svg.setAttribute("aria-hidden","true");const use=document.createElementNS("http://www.w3.org/2000/svg","use");use.setAttribute("href",`#${id}`);svg.append(use);return svg}
function iconId(entry){if(entry.restrictionCode)return"icon-restricted";if(entry.kind==="directory")return"icon-folder";if(entry.kind==="link")return"icon-link";return"icon-file"}
function sortedEntries(state){const values=[...state.entries];const rank={directory:0,file:1,link:2};values.sort((a,b)=>{let result=0;if(state.sortKey==="name"){result=(rank[a.kind]??9)-(rank[b.kind]??9);if(result===0)result=a.name.localeCompare(b.name,"ru",{numeric:true,sensitivity:"base"})}else if(state.sortKey==="kind"){result=(rank[a.kind]??9)-(rank[b.kind]??9);if(result===0)result=a.name.localeCompare(b.name,"ru",{numeric:true,sensitivity:"base"})}else if(state.sortKey==="size"){result=(a.size??-1)-(b.size??-1);if(result===0)result=a.name.localeCompare(b.name,"ru",{numeric:true,sensitivity:"base"})}else{result=new Date(a.lastModifiedAt||0)-new Date(b.lastModifiedAt||0);if(result===0)result=a.name.localeCompare(b.name,"ru",{numeric:true,sensitivity:"base"})}return state.sortDirection==="asc"?result:-result});return values}
function createOpenControl(side,entry){const button=document.createElement("button");button.type="button";button.className="entry-open";button.dataset.entryOpen="true";const restricted=Boolean(entry.restrictionCode)||entry.kind==="link";button.disabled=restricted;button.setAttribute("aria-disabled",restricted?"true":"false");const kindName=entry.kind==="directory"?"Каталог":entry.kind==="link"?"Ссылка":"Файл";button.title=restricted?`${kindName} недоступен из-за ограничения`:`${kindName}: ${entry.name}`;button.append(iconElement(iconId(entry)));const label=document.createElement("span");label.textContent=entry.name;button.append(label);button.onclick=()=>openEntry(side,entry);return button}
function actionButton(symbol,title,kind,disabled,handler){const button=document.createElement("button");button.type="button";button.textContent=symbol;button.title=title;button.setAttribute("aria-label",title);button.dataset.action=kind;button.disabled=disabled;button.onclick=handler;return button}
function createRowActions(side,entry){const state=panels[side],other=panels[otherSide(side)],cell=document.createElement("td");cell.className="actions";const restricted=Boolean(entry.restrictionCode)||entry.kind==="link";const sameDirectory=state.relativePath===other.relativePath;const moveDisabled=state.loading||other.loading||restricted||sameDirectory;const renameDisabled=state.loading||restricted;const canDelete=!entry.restrictionCode||entry.restrictionCode==="active_extension";const deleteDisabled=state.loading||entry.kind==="link"||!canDelete;const moveTitle=side==="left"?"Переместить вправо":"Переместить влево";cell.append(actionButton(side==="left"?"→":"←",moveTitle,"move",moveDisabled,()=>moveEntry(side,entry)),actionButton("✎","Переименовать","rename",renameDisabled,()=>renameEntry(side,entry)),actionButton("×","Удалить", "delete",deleteDisabled,()=>deleteEntry(side,entry)));return cell}
function appendParentRow(side,body){const state=panels[side];if(!state.relativePath)return;const row=document.createElement("tr");row.className="parent-row entry-kind-directory";row.dataset.parentRow="true";const name=document.createElement("td"),button=document.createElement("button");button.type="button";button.className="entry-open";button.dataset.entryOpen="true";button.title="На уровень вверх";button.append(iconElement("icon-folder"));const label=document.createElement("span");label.textContent="..";button.append(label);button.onclick=()=>navigate(side,parentRelative(state.relativePath));name.append(button);row.append(name);for(let i=0;i<5;i++)row.append(document.createElement("td"));body.append(row)}
function renderPanel(side){const state=panels[side],body=byId(`filesystem-${side}-entries`);renderBreadcrumb(side);body.replaceChildren();appendParentRow(side,body);if(activeRoot){for(const source of sortedEntries(state)){const relative=joinRelative(state.relativePath,source.name),entry=Object.freeze({...source,fullPath:logicalPath(activeRoot,relative)});const row=document.createElement("tr");row.className=`entry-kind-${entry.kind}`+(entry.restrictionCode?" entry-restricted":"");const name=document.createElement("td");name.append(createOpenControl(side,entry));const size=document.createElement("td");size.textContent=fmtSize(entry.size);const created=document.createElement("td");created.textContent=fmt(entry.createdAt);const modified=document.createElement("td");modified.textContent=fmt(entry.lastModifiedAt);const restriction=document.createElement("td");restriction.className="restriction";restriction.textContent=entry.restrictionCode||"—";row.append(name,size,created,modified,restriction,createRowActions(side,entry));body.append(row)}}const more=byId(`filesystem-${side}-load-more`);more.hidden=!state.nextCursor;more.disabled=state.loading;for(const id of ["create-file","create-directory","upload","refresh"]){byId(`filesystem-${side}-${id}`).disabled=!activeRoot||state.loading}byId(`filesystem-${side}-sort-key`).value=state.sortKey;byId(`filesystem-${side}-sort-direction`).textContent=state.sortDirection==="asc"?"↑":"↓"}
function renderAll(){renderRootButtons();renderPanel("left");renderPanel("right")}
async function fetchListing(root,relative,cursor=null){const extra=`&limit=200${cursor?`&cursor=${encodeURIComponent(cursor)}`:""}`;const response=await requireOk(await fetch(query(api.list,logicalPath(root,relative),extra),{cache:"no-store"}));return response.json()}
async function loadDirectory(side,target,{append=false,recoverCurrent=false}={}){const state=panels[side],root=activeRoot;if(!root)return false;const generation=++state.generation;state.loading=true;renderPanel(side);setPanelStatus(side,"Загрузка…");try{const payload=await fetchListing(root,target,append?state.nextCursor:null);if(generation!==state.generation||root!==activeRoot)return false;state.relativePath=target;state.entries=append?state.entries.concat(payload.entries||[]):payload.entries||[];state.nextCursor=payload.nextCursor||null;state.loading=false;renderPanel(side);setPanelStatus(side,`Объектов: ${state.entries.length}`);return true}catch(error){if(generation!==state.generation||root!==activeRoot)return false;if(recoverCurrent&&error.code==="not_found"){let candidate=parentRelative(target);while(true){try{const payload=await fetchListing(root,candidate);if(generation!==state.generation||root!==activeRoot)return false;state.relativePath=candidate;state.entries=payload.entries||[];state.nextCursor=payload.nextCursor||null;state.loading=false;renderPanel(side);setPanelStatus(side,"Текущий каталог исчез; выполнен переход к доступному родителю",true);return true}catch(next){if(next.code!=="not_found"||!candidate)break;candidate=parentRelative(candidate)}}}state.loading=false;renderPanel(side);setPanelStatus(side,`Ошибка: ${friendly(error)}`,true);return false}}
async function navigate(side,target){await loadDirectory(side,target)}async function refresh(side){await loadDirectory(side,panels[side].relativePath,{recoverCurrent:true})}
async function selectRoot(root){if(!configuredRoots.includes(root))return;activeRoot=root;for(const state of Object.values(panels)){state.generation++;state.relativePath="";state.entries=[];state.nextCursor=null;state.loading=false}renderAll();setStatus(`Корень: ${root}`);await Promise.all([loadDirectory("left",""),loadDirectory("right","")]);renderRootButtons()}
async function refreshPanels(){await Promise.all([refresh("left"),refresh("right")])}
async function mutate(operation,success){try{await operation();setStatus(success);await refreshPanels();return true}catch(error){setStatus(`Ошибка: ${friendly(error)}`,true);await refreshPanels();return false}}
async function openEntry(side,entry){if(entry.kind==="directory")return navigate(side,joinRelative(panels[side].relativePath,entry.name));if(entry.kind!=="file"||entry.restrictionCode)return;const anchor=document.createElement("a");anchor.href=query(api.file,entry.fullPath);anchor.download=entry.name;document.body.append(anchor);anchor.click();anchor.remove()}
async function moveEntry(side,entry){const destinationPanel=panels[otherSide(side)];const destination=logicalPath(activeRoot,joinRelative(destinationPanel.relativePath,entry.name));await mutate(()=>requireOk(fetch(api.move,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sourcePath:entry.fullPath,destinationPath:destination})})),"Перемещено")}
async function renameEntry(side,entry){const name=prompt("Новое имя",entry.name);if(!name||name===entry.name)return;const destination=logicalPath(activeRoot,joinRelative(panels[side].relativePath,name));await mutate(()=>requireOk(fetch(api.move,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sourcePath:entry.fullPath,destinationPath:destination})})),"Переименовано")}
async function deleteEntry(side,entry){if(!confirm(`Удалить ${entry.name}?`))return;const url=entry.kind==="directory"?api.directory:api.file;await mutate(()=>requireOk(fetch(query(url,entry.fullPath),{method:"DELETE"})),"Удалено")}
async function createDirectory(side){const name=prompt("Имя каталога");if(!name)return;const path=logicalPath(activeRoot,joinRelative(panels[side].relativePath,name));await mutate(()=>requireOk(fetch(api.directory,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path})})),"Каталог создан")}
async function createFile(side){const name=prompt("Имя пустого файла");if(!name)return;await uploadFile(side,new File([new Uint8Array(0)],name,{type:"application/octet-stream"}))}
async function uploadFile(side,file){if(!file)return;const path=logicalPath(activeRoot,joinRelative(panels[side].relativePath,file.name));await mutate(()=>requireOk(fetch(query(api.file,path),{method:"PUT",headers:{"Content-Type":"application/octet-stream"},body:file})),"Файл опубликован")}
function bindPanel(side){byId(`filesystem-${side}-create-file`).onclick=()=>createFile(side);byId(`filesystem-${side}-create-directory`).onclick=()=>createDirectory(side);byId(`filesystem-${side}-refresh`).onclick=()=>refresh(side);byId(`filesystem-${side}-load-more`).onclick=()=>loadDirectory(side,panels[side].relativePath,{append:true});const input=byId(`filesystem-${side}-upload-input`);input.addEventListener("change",async()=>{const file=input.files?.[0];input.value="";if(file)await uploadFile(side,file)});byId(`filesystem-${side}-upload`).onclick=()=>{if(typeof input.showPicker==="function")input.showPicker();else input.click()};const sortKey=byId(`filesystem-${side}-sort-key`);sortKey.onchange=()=>{panels[side].sortKey=sortKey.value;renderPanel(side)};byId(`filesystem-${side}-sort-direction`).onclick=()=>{panels[side].sortDirection=panels[side].sortDirection==="asc"?"desc":"asc";renderPanel(side)}}
async function loadRoots(){try{const response=await requireOk(await fetch(api.roots,{cache:"no-store"}));const payload=await response.json();configuredRoots=Array.isArray(payload.roots)?payload.roots:[];renderRootButtons();if(configuredRoots.length===0){setStatus("Нет настроенных логических корней",true);return}await selectRoot(configuredRoots[0])}catch(error){setStatus(`Ошибка: ${friendly(error)}`,true);renderAll()}}
bindPanel("left");bindPanel("right");renderAll();void loadRoots();
</script>
<!-- Контрактные маркеры реальных row actions: data-action="move" data-action="rename" data-action="delete" -->
</main>
</body>
</html>
