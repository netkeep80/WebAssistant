<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebAssistant — файлы</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;--splitter-width:10px;--panel-min:360px}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:Canvas;color:CanvasText}
main{height:100dvh;width:100%;padding:14px 18px;display:flex;flex-direction:column;overflow:hidden}
header,.roots,.toolbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header{justify-content:space-between;margin-bottom:6px;flex:0 0 auto}
h1,h2{margin:.15em 0}p{margin:.3em 0}.muted{opacity:.72}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
.roots{padding:6px 0 8px;flex:0 0 auto}.root-button{padding:6px 12px;border:1px solid color-mix(in srgb,CanvasText 30%,transparent);border-radius:8px;background:Canvas}.root-button.active{font-weight:700;outline:2px solid LinkText;outline-offset:1px}
.global-status{min-height:1.35em;margin:2px 0 8px;flex:0 0 auto}.global-status[data-state=error],.panel-status[data-state=error]{font-weight:600}
.panels{display:flex;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden}
.panel{flex:1 1 0;min-width:0;border:1px solid color-mix(in srgb,CanvasText 24%,transparent);border-radius:10px;padding:10px;background:color-mix(in srgb,Canvas 96%,CanvasText 4%);display:flex;flex-direction:column;overflow:hidden;outline:none}
.panel.current-panel{box-shadow:inset 0 0 0 2px color-mix(in srgb,LinkText 55%,transparent)}
.splitter{flex:0 0 var(--splitter-width);width:var(--splitter-width);cursor:col-resize;touch-action:none;position:relative;outline:none}
.splitter::before{content:"";position:absolute;top:8px;bottom:8px;left:50%;width:2px;transform:translateX(-50%);background:color-mix(in srgb,CanvasText 30%,transparent);border-radius:2px}
.splitter:hover::before,.splitter.dragging::before,.splitter:focus-visible::before{width:4px;background:LinkText}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}.breadcrumb{min-height:30px;padding:4px 0;display:block;flex:0 0 auto;overflow-wrap:anywhere}.breadcrumb button{display:inline;border:0;background:none;color:LinkText;text-decoration:underline;padding:2px 3px}.toolbar{margin:3px 0;flex:0 0 auto}.toolbar button{padding:5px 7px}.upload-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.panel-status{min-height:1.3em;margin:4px 0;flex:0 0 auto}
.table-wrap{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.col-name{width:28%}col.col-size{width:10%}col.col-created{width:15%}col.col-modified{width:15%}col.col-restriction{width:14%}col.col-actions{width:18%}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid color-mix(in srgb,CanvasText 16%,transparent);vertical-align:middle;white-space:normal;overflow-wrap:anywhere;min-width:0}
thead th{position:sticky;top:0;z-index:2;background:color-mix(in srgb,Canvas 94%,CanvasText 6%)}
.sort-button{display:inline-flex;gap:4px;align-items:center;max-width:100%;padding:2px 3px;border:0;background:transparent;color:inherit;font-weight:700;text-align:left}.sort-button:hover,.sort-button:focus-visible{color:LinkText;text-decoration:underline}.sort-indicator{font-size:.85em;min-width:.8em}
.entry-open{display:inline-flex;gap:6px;align-items:center;border:0;background:none;padding:3px 2px;color:inherit;text-align:left;font:inherit;max-width:100%;min-width:0}.entry-open span{min-width:0;overflow-wrap:anywhere}.entry-open:not(:disabled):hover,.entry-open:not(:disabled):focus-visible{text-decoration:underline;background:color-mix(in srgb,LinkText 10%,transparent);border-radius:5px}.entry-icon{width:16px;height:16px;flex:0 0 16px}.entry-kind-directory .entry-open{color:LinkText;font-weight:600}.entry-kind-file .entry-open{color:CanvasText}.entry-kind-link,.entry-restricted{opacity:.67}.entry-restricted .entry-open{font-style:italic}.parent-row .entry-open{font-weight:700;color:LinkText}
tr.current-row{outline:2px solid color-mix(in srgb,LinkText 70%,transparent);outline-offset:-2px;background:color-mix(in srgb,LinkText 10%,transparent)}tr[draggable=true]{cursor:grab}tr.dragging-row{opacity:.45}
.panel.drop-target{box-shadow:inset 0 0 0 3px color-mix(in srgb,LinkText 75%,transparent)}.panel.drop-forbidden{box-shadow:inset 0 0 0 3px color-mix(in srgb,Mark 75%,transparent)}
.actions{justify-content:flex-end;gap:2px;flex-wrap:nowrap}.actions button{width:24px;height:24px;min-width:20px;padding:1px;border-radius:5px}.restriction{max-width:none}.load-more{margin-top:6px;flex:0 0 auto}.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
@media(max-width:900px){main{padding:8px}.panel{padding:7px}th,td{font-size:.9rem;padding:5px 3px}.actions button{width:22px;height:22px}}
</style>
</head>
<body>
<svg class="icon-sprite" aria-hidden="true" focusable="false">
<symbol id="icon-folder" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h7l2 2h9v12H3z"/></symbol>
<symbol id="icon-file" viewBox="0 0 24 24"><path fill="currentColor" d="M5 2h9l5 5v15H5zm9 2v5h5"/></symbol>
<symbol id="icon-restricted" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m5.7 4.9L6.9 17.7A8 8 0 0 1 17.7 6.9M6.3 17.1A8 8 0 0 1 17.1 6.3z"/></symbol>
<symbol id="icon-link" viewBox="0 0 24 24"><path fill="currentColor" d="M8.5 14.5 5 18a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0l1 1-1.5 1.5-1-1a1.5 1.5 0 0 0-2 0l-4 4a1.5 1.5 0 1 0 2 2L7 13zm7-5L19 6a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0l-1-1 1.5-1.5 1 1a1.5 1.5 0 1 0 2-2L17 11zM7 11h10v2H7z"/></symbol>
</svg>
<main>
<header><div><h1>Файлы WebAssistant</h1><p class="muted">Файлы передаются как недоверенные непрозрачные данные без встроенного просмотра.</p></div><a href="/">Диагностика</a></header>
<nav id="filesystem-roots" class="roots" aria-label="Логические корни"></nav>
<p id="filesystem-status" class="global-status muted">Загрузка списка корней…</p>
<div id="filesystem-panels" class="panels">
<section id="filesystem-left" class="panel current-panel" aria-label="Левая панель" tabindex="0">
<div class="panel-header"><h2>Левая панель</h2></div>
<nav id="filesystem-left-breadcrumb" class="breadcrumb" aria-label="Путь левой панели">—</nav>
<div class="toolbar">
<button id="filesystem-left-create-file" type="button">Создать файл</button>
<button id="filesystem-left-create-directory" type="button">Создать каталог</button>
<button id="filesystem-left-upload" type="button">Загрузить файл</button>
<input id="filesystem-left-upload-input" class="upload-input" type="file" tabindex="-1" multiple>
<button id="filesystem-left-refresh" type="button">Обновить</button>
</div>
<p id="filesystem-left-status" class="panel-status muted"></p>
<div id="filesystem-left-table-wrap" class="table-wrap"><table><colgroup><col class="col-name"><col class="col-size"><col class="col-created"><col class="col-modified"><col class="col-restriction"><col class="col-actions"></colgroup><thead><tr><th data-sort-key="name" aria-sort="ascending"><button class="sort-button" type="button" data-sort-key="name">Имя <span class="sort-indicator">↑</span></button></th><th data-sort-key="size" aria-sort="none"><button class="sort-button" type="button" data-sort-key="size">Размер <span class="sort-indicator"></span></button></th><th data-sort-key="createdAt" aria-sort="none"><button class="sort-button" type="button" data-sort-key="createdAt">Создан <span class="sort-indicator"></span></button></th><th data-sort-key="lastModifiedAt" aria-sort="none"><button class="sort-button" type="button" data-sort-key="lastModifiedAt">Изменён <span class="sort-indicator"></span></button></th><th data-sort-key="restrictionCode" aria-sort="none"><button class="sort-button" type="button" data-sort-key="restrictionCode">Ограничение <span class="sort-indicator"></span></button></th><th>Действия</th></tr></thead><tbody id="filesystem-left-entries"></tbody></table></div>
<button id="filesystem-left-load-more" class="load-more" type="button" hidden>Показать ещё</button>
</section>
<div id="filesystem-splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Изменить ширину файловых панелей" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>
<section id="filesystem-right" class="panel" aria-label="Правая панель" tabindex="0">
<div class="panel-header"><h2>Правая панель</h2></div>
<nav id="filesystem-right-breadcrumb" class="breadcrumb" aria-label="Путь правой панели">—</nav>
<div class="toolbar">
<button id="filesystem-right-create-file" type="button">Создать файл</button>
<button id="filesystem-right-create-directory" type="button">Создать каталог</button>
<button id="filesystem-right-upload" type="button">Загрузить файл</button>
<input id="filesystem-right-upload-input" class="upload-input" type="file" tabindex="-1" multiple>
<button id="filesystem-right-refresh" type="button">Обновить</button>
</div>
<p id="filesystem-right-status" class="panel-status muted"></p>
<div id="filesystem-right-table-wrap" class="table-wrap"><table><colgroup><col class="col-name"><col class="col-size"><col class="col-created"><col class="col-modified"><col class="col-restriction"><col class="col-actions"></colgroup><thead><tr><th data-sort-key="name" aria-sort="ascending"><button class="sort-button" type="button" data-sort-key="name">Имя <span class="sort-indicator">↑</span></button></th><th data-sort-key="size" aria-sort="none"><button class="sort-button" type="button" data-sort-key="size">Размер <span class="sort-indicator"></span></button></th><th data-sort-key="createdAt" aria-sort="none"><button class="sort-button" type="button" data-sort-key="createdAt">Создан <span class="sort-indicator"></span></button></th><th data-sort-key="lastModifiedAt" aria-sort="none"><button class="sort-button" type="button" data-sort-key="lastModifiedAt">Изменён <span class="sort-indicator"></span></button></th><th data-sort-key="restrictionCode" aria-sort="none"><button class="sort-button" type="button" data-sort-key="restrictionCode">Ограничение <span class="sort-indicator"></span></button></th><th>Действия</th></tr></thead><tbody id="filesystem-right-entries"></tbody></table></div>
<button id="filesystem-right-load-more" class="load-more" type="button" hidden>Показать ещё</button>
</section>
</div>
<script>
"use strict";
const api=Object.freeze({roots:"/v1/filesystem/roots",list:"/v1/filesystem/list",file:"/v1/filesystem/file",directory:"/v1/filesystem/directory",move:"/v1/filesystem/move"});
const byId=id=>document.getElementById(id);
let activeRoot=null;
let configuredRoots=[];
let currentSide="left";
let internalDrag=null;
let splitRatio=.5;
const panels={left:createPanelState("left"),right:createPanelState("right")};
function createPanelState(side){return{side,relativePath:"",entries:[],nextCursor:null,sortKey:"name",sortDirection:"asc",selectedPath:null,generation:0,loading:false}}
const otherSide=side=>side==="left"?"right":"left";
const joinRelative=(base,name)=>base?`${base}/${name}`:name;
const parentRelative=path=>{const i=path.lastIndexOf("/");return i<0?"":path.slice(0,i)};
const logicalPath=(root,relative)=>relative?`${root}/${relative}`:`${root}/`;
const query=(url,path,extra="")=>`${url}?path=${encodeURIComponent(path)}${extra}`;
const parentSelection=side=>`parent:${panels[side].relativePath}`;
async function problem(response){try{const p=await response.json();return{code:p.code||`http_${response.status}`,message:p.title||`HTTP ${response.status}`}}catch{return{code:`http_${response.status}`,message:`HTTP ${response.status}`}}}
async function requireOk(responseOrPromise){const response=await responseOrPromise;if(response.ok)return response;const p=await problem(response);const e=new Error(p.message);e.code=p.code;throw e}
function friendly(error){const names={filesystem_not_configured:"Файловая подсистема не настроена",filesystem_configuration_invalid:"Конфигурация файловой подсистемы некорректна",filesystem_root_not_found:"Логический корень не найден",filesystem_root_unavailable:"Логический корень временно недоступен",filesystem_path_invalid:"Недопустимый путь",destination_exists:"Объект с таким именем уже существует",directory_not_empty:"Каталог не пуст",blocked_file_type:"Этот тип файла запрещён",locked:"Объект заблокирован другой программой",not_found:"Объект больше не существует",unsafe_link:"Операция со ссылкой запрещена",hardlink_rejected:"Операция с hard-link запрещена"};return `${names[error.code]||error.message||"Ошибка"} (${error.code||"network_error"})`}
function setStatus(text,error=false){const el=byId("filesystem-status");el.textContent=text;el.dataset.state=error?"error":"ok"}
function setPanelStatus(side,text,error=false){const el=byId(`filesystem-${side}-status`);el.textContent=text;el.dataset.state=error?"error":"ok"}
function fmt(value){return value?new Date(value).toLocaleString():"—"}
function fmtSize(value){return value==null?"—":`${value} байт`}
function renderRootButtons(){const nav=byId("filesystem-roots");nav.replaceChildren();for(const root of configuredRoots){const button=document.createElement("button");button.type="button";button.className="root-button"+(root===activeRoot?" active":"");button.dataset.root=root;button.textContent=root;button.setAttribute("aria-pressed",root===activeRoot?"true":"false");button.onclick=()=>selectRoot(root);nav.append(button)}}
function renderBreadcrumb(side){const state=panels[side],nav=byId(`filesystem-${side}-breadcrumb`);nav.replaceChildren();if(!activeRoot){nav.textContent="—";return}const rootButton=document.createElement("button");rootButton.type="button";rootButton.textContent=activeRoot;rootButton.dataset.path=logicalPath(activeRoot,"");rootButton.onclick=()=>navigate(side,"");nav.append(rootButton);let built="";for(const part of state.relativePath?state.relativePath.split("/"):[]){nav.append(document.createTextNode(" / "));built=joinRelative(built,part);const target=built,button=document.createElement("button");button.type="button";button.textContent=part;button.dataset.path=logicalPath(activeRoot,target);button.onclick=()=>navigate(side,target);nav.append(button)}}
function iconElement(id){const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("class","entry-icon");svg.setAttribute("aria-hidden","true");const use=document.createElementNS("http://www.w3.org/2000/svg","use");use.setAttribute("href",`#${id}`);svg.append(use);return svg}
function iconId(entry){if(entry.restrictionCode)return"icon-restricted";if(entry.kind==="directory")return"icon-folder";if(entry.kind==="link")return"icon-link";return"icon-file"}
function compareValue(entry,key){if(key==="size")return entry.size??-1;if(key==="createdAt"||key==="lastModifiedAt")return new Date(entry[key]||0).getTime();if(key==="restrictionCode")return entry.restrictionCode||"";return entry.name}
function sortedEntries(state){const values=[...state.entries],rank={directory:0,file:1,link:2};values.sort((a,b)=>{let result=0;if(state.sortKey==="name"){result=(rank[a.kind]??9)-(rank[b.kind]??9);if(result===0)result=a.name.localeCompare(b.name,"ru",{numeric:true,sensitivity:"base"})}else{const av=compareValue(a,state.sortKey),bv=compareValue(b,state.sortKey);result=typeof av==="number"?av-bv:String(av).localeCompare(String(bv),"ru",{numeric:true,sensitivity:"base"});if(result===0)result=a.name.localeCompare(b.name,"ru",{numeric:true,sensitivity:"base"})}return state.sortDirection==="asc"?result:-result});return values}
function createOpenControl(side,entry){const button=document.createElement("button");button.type="button";button.className="entry-open";button.dataset.entryOpen="true";const restricted=Boolean(entry.restrictionCode)||entry.kind==="link";button.disabled=restricted;button.setAttribute("aria-disabled",restricted?"true":"false");const kindName=entry.kind==="directory"?"Каталог":entry.kind==="link"?"Ссылка":"Файл";button.title=restricted?`${kindName} недоступен из-за ограничения`:`${kindName}: ${entry.name}`;button.append(iconElement(iconId(entry)));const label=document.createElement("span");label.textContent=entry.name;button.append(label);button.onclick=()=>openEntry(side,entry);return button}
function actionButton(symbol,title,kind,disabled,handler){const button=document.createElement("button");button.type="button";button.textContent=symbol;button.title=title;button.setAttribute("aria-label",title);button.dataset.action=kind;button.disabled=disabled;button.onclick=handler;return button}
function createRowActions(side,entry){const state=panels[side],other=panels[otherSide(side)],cell=document.createElement("td");cell.className="actions";const restricted=Boolean(entry.restrictionCode)||entry.kind==="link";const sameDirectory=state.relativePath===other.relativePath;const moveDisabled=state.loading||other.loading||restricted||sameDirectory;const renameDisabled=state.loading||restricted;const canDelete=!entry.restrictionCode||entry.restrictionCode==="active_extension";const deleteDisabled=state.loading||entry.kind==="link"||!canDelete;const moveTitle=side==="left"?"Переместить вправо":"Переместить влево";cell.append(actionButton(side==="left"?"→":"←",moveTitle,"move",moveDisabled,()=>moveEntry(side,entry)),actionButton("✎","Переименовать","rename",renameDisabled,()=>renameEntry(side,entry)),actionButton("×","Удалить","delete",deleteDisabled,()=>deleteEntry(side,entry)));return cell}
function bindRowSelection(side,row,selectionId){row.dataset.selectionId=selectionId;row.setAttribute("aria-selected","false");row.addEventListener("click",event=>{if(event.target.closest("[data-action]"))return;selectRow(side,selectionId,true)});row.addEventListener("pointerdown",()=>{currentSide=side;renderCurrentState()})}
function appendParentRow(side,body){const state=panels[side];if(!state.relativePath)return;const row=document.createElement("tr");row.className="parent-row entry-kind-directory";row.dataset.parentRow="true";bindRowSelection(side,row,parentSelection(side));const name=document.createElement("td"),button=document.createElement("button");button.type="button";button.className="entry-open";button.dataset.entryOpen="true";button.title="На уровень вверх";button.append(iconElement("icon-folder"));const label=document.createElement("span");label.textContent="..";button.append(label);button.onclick=()=>navigate(side,parentRelative(state.relativePath));name.append(button);row.append(name);for(let i=0;i<5;i++)row.append(document.createElement("td"));body.append(row)}
function makeEntry(side,source){const state=panels[side],relative=joinRelative(state.relativePath,source.name);return Object.freeze({...source,fullPath:logicalPath(activeRoot,relative)})}
function renderSortHeaders(side){const state=panels[side],panel=byId(`filesystem-${side}`);for(const th of panel.querySelectorAll("thead th[data-sort-key]")){const key=th.dataset.sortKey,active=key===state.sortKey;th.setAttribute("aria-sort",active?(state.sortDirection==="asc"?"ascending":"descending"):"none");const indicator=th.querySelector(".sort-indicator");if(indicator)indicator.textContent=active?(state.sortDirection==="asc"?"↑":"↓"):""}}
function renderPanel(side){const state=panels[side],body=byId(`filesystem-${side}-entries`);renderBreadcrumb(side);body.replaceChildren();appendParentRow(side,body);if(activeRoot){for(const source of sortedEntries(state)){const entry=makeEntry(side,source),row=document.createElement("tr");row.className=`entry-kind-${entry.kind}`+(entry.restrictionCode?" entry-restricted":"");bindRowSelection(side,row,entry.fullPath);const restricted=Boolean(entry.restrictionCode)||entry.kind==="link";if(!restricted&&(entry.kind==="file"||entry.kind==="directory")){row.draggable=true;row.dataset.draggable="true";row.addEventListener("dragstart",event=>startInternalDrag(event,side,entry));row.addEventListener("dragend",finishDrag)}const name=document.createElement("td");name.append(createOpenControl(side,entry));const size=document.createElement("td");size.textContent=fmtSize(entry.size);const created=document.createElement("td");created.textContent=fmt(entry.createdAt);const modified=document.createElement("td");modified.textContent=fmt(entry.lastModifiedAt);const restriction=document.createElement("td");restriction.className="restriction";restriction.textContent=entry.restrictionCode||"—";row.append(name,size,created,modified,restriction,createRowActions(side,entry));body.append(row)}}const more=byId(`filesystem-${side}-load-more`);more.hidden=!state.nextCursor;more.disabled=state.loading;for(const id of ["create-file","create-directory","upload","refresh"]){byId(`filesystem-${side}-${id}`).disabled=!activeRoot||state.loading}renderSortHeaders(side);ensureSelectionExists(side);renderCurrentState()}
function renderAll(){renderRootButtons();renderPanel("left");renderPanel("right");applySplit(splitRatio)}
function renderPanels(){renderPanel("left");renderPanel("right")}
function selectionRows(side){return [...byId(`filesystem-${side}-entries`).querySelectorAll("tr[data-selection-id]")]}
function ensureSelectionExists(side){const state=panels[side];if(!state.selectedPath)return;if(!selectionRows(side).some(row=>row.dataset.selectionId===state.selectedPath))state.selectedPath=null}
function renderCurrentState(){for(const side of ["left","right"]){const panel=byId(`filesystem-${side}`);panel.classList.toggle("current-panel",side===currentSide);for(const row of selectionRows(side)){const selected=row.dataset.selectionId===panels[side].selectedPath;row.classList.toggle("current-row",selected);row.setAttribute("aria-selected",selected?"true":"false")}}}
function selectRow(side,selectionId,focus=false){currentSide=side;panels[side].selectedPath=selectionId;renderCurrentState();const row=selectionRows(side).find(candidate=>candidate.dataset.selectionId===selectionId);row?.scrollIntoView({block:"nearest"});if(focus)byId(`filesystem-${side}`).focus({preventScroll:true})}
async function fetchListing(root,relative,cursor=null){const extra=`&limit=200${cursor?`&cursor=${encodeURIComponent(cursor)}`:""}`;const response=await requireOk(await fetch(query(api.list,logicalPath(root,relative),extra),{cache:"no-store"}));return response.json()}
async function loadDirectory(side,target,{append=false,recoverCurrent=false}={}){const state=panels[side],root=activeRoot;if(!root)return false;const generation=++state.generation;state.loading=true;renderPanels();setPanelStatus(side,"Загрузка…");try{const payload=await fetchListing(root,target,append?state.nextCursor:null);if(generation!==state.generation||root!==activeRoot)return false;state.relativePath=target;state.entries=append?state.entries.concat(payload.entries||[]):payload.entries||[];state.nextCursor=payload.nextCursor||null;if(!append)state.selectedPath=null;state.loading=false;renderPanels();setPanelStatus(side,`Объектов: ${state.entries.length}`);return true}catch(error){if(generation!==state.generation||root!==activeRoot)return false;if(recoverCurrent&&error.code==="not_found"){let candidate=parentRelative(target);while(true){try{const payload=await fetchListing(root,candidate);if(generation!==state.generation||root!==activeRoot)return false;state.relativePath=candidate;state.entries=payload.entries||[];state.nextCursor=payload.nextCursor||null;state.selectedPath=null;state.loading=false;renderPanels();setPanelStatus(side,"Текущий каталог исчез; выполнен переход к доступному родителю",true);return true}catch(next){if(next.code!=="not_found"||!candidate)break;candidate=parentRelative(candidate)}}}state.loading=false;renderPanels();setPanelStatus(side,`Ошибка: ${friendly(error)}`,true);return false}}
async function navigate(side,target){await loadDirectory(side,target)}
async function refresh(side){const selected=panels[side].selectedPath,ok=await loadDirectory(side,panels[side].relativePath,{recoverCurrent:true});if(ok&&selected){panels[side].selectedPath=selected;ensureSelectionExists(side);renderCurrentState()}return ok}
async function selectRoot(root){if(!configuredRoots.includes(root))return;activeRoot=root;currentSide="left";for(const state of Object.values(panels)){state.generation++;state.relativePath="";state.entries=[];state.nextCursor=null;state.selectedPath=null;state.loading=false}renderAll();setStatus(`Корень: ${root}`);await Promise.all([loadDirectory("left",""),loadDirectory("right","")]);renderRootButtons();byId("filesystem-left").focus({preventScroll:true})}
async function refreshPanels(){await Promise.all([refresh("left"),refresh("right")])}
async function mutate(operation,success){try{await operation();setStatus(success);await refreshPanels();return true}catch(error){setStatus(`Ошибка: ${friendly(error)}`,true);await refreshPanels();return false}}
async function openEntry(side,entry){if(entry.kind==="directory")return navigate(side,joinRelative(panels[side].relativePath,entry.name));if(entry.kind!=="file"||entry.restrictionCode)return;const anchor=document.createElement("a");anchor.href=query(api.file,entry.fullPath);anchor.download=entry.name;document.body.append(anchor);anchor.click();anchor.remove()}
async function moveEntryToSide(sourceSide,entry,targetSide){if(sourceSide===targetSide)return false;const sourcePanel=panels[sourceSide],destinationPanel=panels[targetSide];if(sourcePanel.relativePath===destinationPanel.relativePath){setStatus("Перемещение недоступно: обе панели показывают один каталог",true);return false}const destination=logicalPath(activeRoot,joinRelative(destinationPanel.relativePath,entry.name));return mutate(()=>requireOk(fetch(api.move,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sourcePath:entry.fullPath,destinationPath:destination})})),"Перемещено")}
async function moveEntry(side,entry){return moveEntryToSide(side,entry,otherSide(side))}
async function renameEntry(side,entry){const name=prompt("Новое имя",entry.name);if(!name||name===entry.name)return;const destination=logicalPath(activeRoot,joinRelative(panels[side].relativePath,name));await mutate(()=>requireOk(fetch(api.move,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sourcePath:entry.fullPath,destinationPath:destination})})),"Переименовано")}
async function deleteEntry(side,entry){if(!confirm(`Удалить ${entry.name}?`))return;const url=entry.kind==="directory"?api.directory:api.file;await mutate(()=>requireOk(fetch(query(url,entry.fullPath),{method:"DELETE"})),"Удалено")}
async function createDirectory(side){const name=prompt("Имя каталога");if(!name)return;const path=logicalPath(activeRoot,joinRelative(panels[side].relativePath,name));await mutate(()=>requireOk(fetch(api.directory,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path})})),"Каталог создан")}
async function createFile(side){const name=prompt("Имя пустого файла");if(!name)return;await uploadFile(side,new File([new Uint8Array(0)],name,{type:"application/octet-stream"}))}
async function putFile(side,file){const path=logicalPath(activeRoot,joinRelative(panels[side].relativePath,file.name));await requireOk(fetch(query(api.file,path),{method:"PUT",headers:{"Content-Type":"application/octet-stream"},body:file}))}
async function uploadFile(side,file){if(!file)return;await mutate(()=>putFile(side,file),"Файл опубликован")}
async function uploadFiles(side,files){const failures=[];let uploaded=0;for(const file of files){try{await putFile(side,file);uploaded++}catch(error){failures.push(`${file.name}: ${friendly(error)}`)}}await refreshPanels();if(failures.length){setPanelStatus(side,`Загружено: ${uploaded}. Ошибки: ${failures.join("; ")}`,true);return false}setPanelStatus(side,`Загружено файлов: ${uploaded}`);return true}
function setSort(side,key){const state=panels[side];if(state.sortKey===key)state.sortDirection=state.sortDirection==="asc"?"desc":"asc";else{state.sortKey=key;state.sortDirection="asc"}renderPanel(side)}
function selectedEntry(side){const state=panels[side];if(!state.selectedPath)return null;if(state.selectedPath===parentSelection(side))return{parent:true};for(const source of state.entries){const entry=makeEntry(side,source);if(entry.fullPath===state.selectedPath)return entry}return null}
async function handlePanelKey(event){if(!["ArrowUp","ArrowDown","Enter","Tab"].includes(event.key))return;if(event.target.closest("input,textarea,select"))return;event.preventDefault();if(event.key==="Tab"){currentSide=otherSide(currentSide);renderCurrentState();byId(`filesystem-${currentSide}`).focus({preventScroll:true});const selected=panels[currentSide].selectedPath;if(selected)selectRow(currentSide,selected,false);return}const side=currentSide,rows=selectionRows(side);if(event.key==="ArrowUp"||event.key==="ArrowDown"){if(!rows.length)return;let index=rows.findIndex(row=>row.dataset.selectionId===panels[side].selectedPath);if(index<0)index=event.key==="ArrowDown"?-1:rows.length;const next=Math.max(0,Math.min(rows.length-1,index+(event.key==="ArrowDown"?1:-1)));selectRow(side,rows[next].dataset.selectionId,false);return}const selected=selectedEntry(side);if(!selected)return;if(selected.parent)return navigate(side,parentRelative(panels[side].relativePath));return openEntry(side,selected)}
function startInternalDrag(event,side,entry){internalDrag={root:activeRoot,sourceSide:side,entry};currentSide=side;panels[side].selectedPath=entry.fullPath;renderCurrentState();event.currentTarget.classList.add("dragging-row");event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("application/x-webassistant-path",entry.fullPath);event.dataTransfer.setData("text/plain",entry.fullPath)}
function clearDropClasses(){for(const side of ["left","right"])byId(`filesystem-${side}`).classList.remove("drop-target","drop-forbidden")}
function finishDrag(event){event?.currentTarget?.classList?.remove("dragging-row");internalDrag=null;clearDropClasses()}
function externalFiles(dataTransfer){return Array.from(dataTransfer?.files||[])}
function canInternalDrop(targetSide){return Boolean(internalDrag&&internalDrag.root===activeRoot&&internalDrag.sourceSide!==targetSide&&panels[internalDrag.sourceSide].relativePath!==panels[targetSide].relativePath)}
function dragHasFiles(event){return Array.from(event.dataTransfer?.types||[]).includes("Files")}
function handleDragOver(event,side){const external=dragHasFiles(event),allowed=external||canInternalDrop(side);if(!allowed&&internalDrag){event.preventDefault();event.dataTransfer.dropEffect="none";clearDropClasses();byId(`filesystem-${side}`).classList.add("drop-forbidden");return}if(!allowed)return;event.preventDefault();event.dataTransfer.dropEffect=external?"copy":"move";clearDropClasses();byId(`filesystem-${side}`).classList.add("drop-target")}
async function handleDrop(event,side){event.preventDefault();const files=externalFiles(event.dataTransfer);clearDropClasses();if(files.length){await uploadFiles(side,files);internalDrag=null;return}if(!canInternalDrop(side)){internalDrag=null;return}const drag=internalDrag;internalDrag=null;await moveEntryToSide(drag.sourceSide,drag.entry,side)}
function bindDropTarget(side){const panel=byId(`filesystem-${side}`);panel.addEventListener("dragenter",event=>handleDragOver(event,side));panel.addEventListener("dragover",event=>handleDragOver(event,side));panel.addEventListener("dragleave",event=>{if(!panel.contains(event.relatedTarget))panel.classList.remove("drop-target","drop-forbidden")});panel.addEventListener("drop",event=>void handleDrop(event,side));panel.addEventListener("pointerdown",event=>{if(event.target.closest(".splitter"))return;currentSide=side;renderCurrentState()})}
function bindPanel(side){byId(`filesystem-${side}-create-file`).onclick=()=>createFile(side);byId(`filesystem-${side}-create-directory`).onclick=()=>createDirectory(side);byId(`filesystem-${side}-refresh`).onclick=()=>refresh(side);byId(`filesystem-${side}-load-more`).onclick=()=>loadDirectory(side,panels[side].relativePath,{append:true});const input=byId(`filesystem-${side}-upload-input`);input.addEventListener("change",async()=>{const files=Array.from(input.files||[]);input.value="";if(files.length===1)await uploadFile(side,files[0]);else if(files.length>1)await uploadFiles(side,files)});byId(`filesystem-${side}-upload`).onclick=()=>{if(typeof input.showPicker==="function")input.showPicker();else input.click()};for(const button of byId(`filesystem-${side}`).querySelectorAll("thead [data-sort-key] button.sort-button")){button.onclick=()=>setSort(side,button.dataset.sortKey)}bindDropTarget(side)}
function minimumPanelWidth(total){return Math.min(380,Math.max(220,(total-byId("filesystem-splitter").offsetWidth)/2))}
function applySplit(ratio){const container=byId("filesystem-panels"),splitter=byId("filesystem-splitter"),left=byId("filesystem-left"),right=byId("filesystem-right"),available=Math.max(0,container.clientWidth-splitter.offsetWidth);if(!available)return;const min=minimumPanelWidth(container.clientWidth),low=Math.min(.5,min/available),high=1-low;splitRatio=Math.max(low,Math.min(high,ratio));const leftWidth=Math.round(available*splitRatio);left.style.flex=`0 0 ${leftWidth}px`;right.style.flex="1 1 0";splitter.setAttribute("aria-valuenow",String(Math.round(splitRatio*100)))}
function bindSplitter(){const splitter=byId("filesystem-splitter"),container=byId("filesystem-panels");let pointerId=null;splitter.addEventListener("pointerdown",event=>{pointerId=event.pointerId;splitter.setPointerCapture(pointerId);splitter.classList.add("dragging");event.preventDefault()});splitter.addEventListener("pointermove",event=>{if(pointerId!==event.pointerId)return;const rect=container.getBoundingClientRect(),available=rect.width-splitter.offsetWidth;if(available>0)applySplit((event.clientX-rect.left)/available)});const stop=event=>{if(pointerId===null)return;if(event&&event.pointerId!==pointerId)return;if(splitter.hasPointerCapture(pointerId))splitter.releasePointerCapture(pointerId);pointerId=null;splitter.classList.remove("dragging")};splitter.addEventListener("pointerup",stop);splitter.addEventListener("pointercancel",stop);splitter.addEventListener("keydown",event=>{if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;event.preventDefault();applySplit(splitRatio+(event.key==="ArrowRight"?.03:-.03))});window.addEventListener("resize",()=>applySplit(splitRatio))}
async function loadRoots(){try{const response=await requireOk(await fetch(api.roots,{cache:"no-store"}));const payload=await response.json();configuredRoots=Array.isArray(payload.roots)?payload.roots:[];renderRootButtons();if(configuredRoots.length===0){setStatus("Нет настроенных логических корней",true);return}await selectRoot(configuredRoots[0])}catch(error){setStatus(`Ошибка: ${friendly(error)}`,true);renderAll()}}
bindPanel("left");
bindPanel("right");
bindSplitter();
byId("filesystem-panels").addEventListener("keydown",event=>void handlePanelKey(event));
renderAll();
void loadRoots();
</script>
