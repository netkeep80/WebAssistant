<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebAssistant — файлы</title>
<style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:Canvas;color:CanvasText}main{padding:24px}header,.toolbar,.forms,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}button,input{font:inherit;padding:7px 9px}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}#filesystem-breadcrumb button{border:0;background:none;text-decoration:underline;padding:2px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid color-mix(in srgb,CanvasText 20%,transparent);vertical-align:top}.restricted{opacity:.7}.muted{opacity:.7}#filesystem-status[data-state=error]{font-weight:600}a{color:LinkText}</style></head>
<body><main><header><div><h1>Файлы WebAssistant</h1><p class="muted">Только Root-relative navigation; содержимое файлов не отображается.</p></div><a href="/">Диагностика</a></header>
<nav id="filesystem-breadcrumb" aria-label="Путь">Root</nav><div class="toolbar"><button id="filesystem-root" type="button">В корень</button><button id="filesystem-up" type="button" disabled>На уровень вверх</button><button id="filesystem-refresh" type="button">Обновить</button></div>
<div class="forms"><button id="filesystem-create-directory" type="button">Создать каталог</button><button id="filesystem-create-empty-file" type="button">Создать пустой файл</button><input id="filesystem-upload-input" type="file"><button id="filesystem-upload" type="button">Загрузить файл</button></div>
<p id="filesystem-status" class="muted">Загрузка…</p><table id="filesystem-table"><thead><tr><th>Имя</th><th>Тип</th><th>Размер</th><th>Создан</th><th>Изменён</th><th>Ограничение</th><th>Действия</th></tr></thead><tbody id="filesystem-entries"></tbody></table><button id="filesystem-load-more" type="button" hidden>Показать ещё</button>
<script>"use strict";
const api=Object.freeze({list:"/v1/filesystem/list",file:"/v1/filesystem/file",directory:"/v1/filesystem/directory",move:"/v1/filesystem/move"});let currentPath="",nextCursor=null,entries=[];
const byId=id=>document.getElementById(id),status=byId("filesystem-status"),body=byId("filesystem-entries"),more=byId("filesystem-load-more"),up=byId("filesystem-up");
const join=(base,name)=>base?`${base}/${name}`:name;const parent=path=>{const i=path.lastIndexOf("/");return i<0?"":path.slice(0,i)};const query=(url,path,extra="")=>`${url}?path=${encodeURIComponent(path)}${extra}`;
async function problem(response){try{const p=await response.json();return{code:p.code||`http_${response.status}`,message:p.title||`HTTP ${response.status}`}}catch{return{code:`http_${response.status}`,message:`HTTP ${response.status}`}}}
async function requireOk(response){if(response.ok)return response;const p=await problem(response);const e=new Error(`${p.message} (${p.code})`);e.code=p.code;throw e}
function setStatus(text,error=false){status.textContent=text;status.dataset.state=error?"error":"ok"}function fmt(v){return v?new Date(v).toLocaleString():"—"}function size(v){return v==null?"—":`${v} байт`}
function renderBreadcrumb(){const parts=currentPath?currentPath.split("/"):[],nav=byId("filesystem-breadcrumb");nav.replaceChildren();const root=document.createElement("button");root.type="button";root.textContent="Root";root.onclick=()=>navigate("");nav.append(root);let built="";for(const part of parts){nav.append(" / ");built=join(built,part);const target=built,b=document.createElement("button");b.type="button";b.textContent=part;b.onclick=()=>navigate(target);nav.append(b)}up.disabled=!currentPath}
function action(label,kind,entry,disabled=false){const b=document.createElement("button");b.type="button";b.textContent=label;b.dataset.action=kind;b.disabled=disabled;b.onclick=()=>act(kind,entry);return b}
function render(){renderBreadcrumb();body.replaceChildren();for(const e of entries){const tr=document.createElement("tr");if(e.restrictionCode)tr.className="restricted";const cells=[e.name,e.kind,size(e.size),fmt(e.createdAt),fmt(e.lastModifiedAt),e.restrictionCode||"—"];for(const text of cells){const td=document.createElement("td");td.textContent=text;tr.append(td)}const td=document.createElement("td"),restricted=Boolean(e.restrictionCode),canDelete=!restricted||e.restrictionCode==="active_extension";td.className="actions";if(e.kind==="directory")td.append(action("Открыть","open",e,restricted));if(e.kind==="file")td.append(action("Скачать","download",e,restricted));td.append(action("Переименовать","rename",e,restricted),action("Переместить","move",e,restricted),action("Удалить","delete",e,!canDelete));tr.append(td);body.append(tr)}more.hidden=!nextCursor}
async function load(append=false){setStatus("Загрузка…");try{const cursor=append&&nextCursor?`&cursor=${encodeURIComponent(nextCursor)}`:"",r=await requireOk(await fetch(query(api.list,currentPath,`&limit=200${cursor}`),{cache:"no-store"})),p=await r.json();entries=append?entries.concat(p.entries||[]):p.entries||[];nextCursor=p.nextCursor||null;render();setStatus(`Объектов: ${entries.length}`)}catch(e){setStatus(`Ошибка: ${e.message}`,true)}}
async function navigate(path){currentPath=path;nextCursor=null;entries=[];await load(false)}async function mutate(fn,success){try{await fn();setStatus(success);await load(false)}catch(e){setStatus(`Ошибка: ${e.message}`,true)}}
async function act(kind,e){const source=join(currentPath,e.name);if(kind==="open")return navigate(source);if(kind==="download"){const a=document.createElement("a");a.href=query(api.file,source);a.download=e.name;document.body.append(a);a.click();a.remove();return}if(kind==="rename"){const name=prompt("Новое имя",e.name);if(!name||name===e.name)return;return move(source,join(currentPath,name))}if(kind==="move"){const dest=prompt("Root-relative путь назначения",source);if(!dest||dest===source)return;return move(source,dest)}if(kind==="delete"){if(!confirm(`Удалить ${e.name}?`))return;const url=e.kind==="directory"?api.directory:api.file;return mutate(async()=>requireOk(await fetch(query(url,source),{method:"DELETE"})),"Удалено")}}
async function move(sourcePath,destinationPath){return mutate(async()=>requireOk(await fetch(api.move,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sourcePath,destinationPath})})),"Перемещено")}
async function createDirectory(){const name=prompt("Имя каталога");if(!name)return;return mutate(async()=>requireOk(await fetch(api.directory,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:join(currentPath,name)})})),"Каталог создан")}
async function uploadBytes(name,bytes){if(!name)return;return mutate(async()=>requireOk(await fetch(query(api.file,join(currentPath,name)),{method:"PUT",headers:{"Content-Type":"application/octet-stream"},body:bytes})),"Файл опубликован")}
byId("filesystem-root").onclick=()=>navigate("");up.onclick=()=>navigate(parent(currentPath));byId("filesystem-refresh").onclick=()=>load(false);more.onclick=()=>load(true);byId("filesystem-create-directory").onclick=createDirectory;byId("filesystem-create-empty-file").onclick=()=>{const n=prompt("Имя пустого файла");if(n)uploadBytes(n,new Uint8Array(0))};byId("filesystem-upload").onclick=()=>{const f=byId("filesystem-upload-input").files?.[0];if(!f){setStatus("Выберите файл",true);return}uploadBytes(f.name,f)};
void load(false);
</script></main></body></html>
<!-- Static action markers for contract visibility: data-action="open" data-action="download" data-action="rename" data-action="move" data-action="delete" -->
