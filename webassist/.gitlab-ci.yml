# Infrastructure-neutral, copy-exportable product CI. Project-specific values
# must be configured in downstream GitLab settings, never in this repository.
stages:
  - utility-tasks
  - build
  - publish

variables:
  WEBASSISTANT_BUILDER_TAG: "dotnet-10.0.403-v1"
  WEBASSISTANT_ALLOW_DOTNET_BOOTSTRAP: "0"

prepare-release-storage:
  stage: utility-tasks
  image: "${CI_DOCKER_HUB}/webassistant-builder:${WEBASSISTANT_BUILDER_TAG}"
  script:
    - |
      set -eu
      : "${CI_PROJECT_NAME:?CI_PROJECT_NAME is required}"
      bash build/distribution/publish-ssh.sh --init-storage "$CI_PROJECT_NAME"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

create-release-config-variable:
  stage: utility-tasks
  image: "$CI_DOCKER_HUB/webassistant-builder:$WEBASSISTANT_BUILDER_TAG"
  script:
    - |
      set -eu
      : "$CI_PROJECT_ACCESS_TOKEN"
      : "$CI_API_V4_URL"
      : "$CI_PROJECT_ID"
      command -v curl >/dev/null
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables"
      code="$(curl -sS -o /dev/null -w '%{http_code}' -H "PRIVATE-TOKEN: $CI_PROJECT_ACCESS_TOKEN" "$api/CI_RELEASE_CONFIG_REPO")"
      case "$code" in
        200) echo 'CI_RELEASE_CONFIG_REPO already exists; leaving value unchanged' ;;
        404)
          created="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "PRIVATE-TOKEN: $CI_PROJECT_ACCESS_TOKEN" \
            --form 'key=CI_RELEASE_CONFIG_REPO' --form 'value=null' --form 'protected=true' --form 'masked=false' --form 'raw=true' "$api")"
          test "$created" = 201 || { echo "variable creation failed, HTTP $created" >&2; exit 1; }
          echo 'CI_RELEASE_CONFIG_REPO created; set its value in private project CI settings'
          ;;
        *) echo "variable lookup failed, HTTP $code" >&2; exit 1 ;;
      esac
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

build-altlinux-release:
  stage: build
  image: "${CI_DOCKER_HUB}/webassistant-builder:${WEBASSISTANT_BUILDER_TAG}"
  variables:
    GIT_STRATEGY: fetch
  script:
    - |
      set -eu
      : "${CI_PROJECT_NAME:?CI_PROJECT_NAME is required}"
      case "$CI_PROJECT_NAME" in
        null|masked_null|[!a-zA-Z0-9]*|*[!a-zA-Z0-9._-]*) echo 'Invalid CI_PROJECT_NAME' >&2; exit 1 ;;
      esac
      : "${CI_COMMIT_SHA:?GitLab source revision is required}"
      bash build/distribution/publish-ssh.sh --check-ci-environment
      test -f VERSION
      version="$(cat VERSION)"
      echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      command -v dotnet >/dev/null 2>&1
      dotnet --list-sdks | grep -Eq '^10\.' || { echo '.NET SDK 10 is required in builder image' >&2; exit 1; }
      for tool in bash jq zip sha256sum base64 stat realpath tar ssh ssh-agent ssh-add find sort cmp diff mv mktemp; do
        command -v "$tool" >/dev/null 2>&1 || { echo "Builder missing $tool" >&2; exit 1; }
      done

      export WEBASSISTANT_SOURCE_SHA="$CI_COMMIT_SHA"
      export WEBASSISTANT_ALLOW_DOTNET_BOOTSTRAP=0
      bash build/linux/package.sh artifacts/linux-x64
      bash build/distribution/release.sh assemble artifacts/linux-x64 artifacts/release-staging "$CI_PROJECT_NAME" "$version" "$CI_COMMIT_SHA"
      release="artifacts/release-staging/products/$CI_PROJECT_NAME/releases/$version"
      bash build/distribution/release.sh verify "$release" "$CI_PROJECT_NAME" "$version" "$CI_COMMIT_SHA"
      bash build/distribution/publish-ssh.sh "$release" "$CI_PROJECT_NAME" "$version" "$CI_COMMIT_SHA"
  # GitLab Job Artifacts не используются: точные байты релиза публикуются напрямую
  # во внешнее неизменяемое хранилище задачей платформенной сборки.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success

publish-release-version:
  stage: publish
  image: "$CI_DOCKER_HUB/webassistant-builder:$WEBASSISTANT_BUILDER_TAG"
  script:
    - |
      set -eu
      : "${CI_PROJECT_NAME:?CI_PROJECT_NAME is required}"
      case "$CI_PROJECT_NAME" in
        null|masked_null|[!a-zA-Z0-9]*|*[!a-zA-Z0-9._-]*) echo 'Invalid CI_PROJECT_NAME' >&2; exit 1 ;;
      esac
      bash build/distribution/publish-config-version.sh --check-ci-environment
      test -f VERSION
      version="$(cat VERSION)"
      echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      bash build/distribution/publish-config-version.sh "$CI_PROJECT_NAME" "$version"
  # Порядок стадий GitLab является платформенным барьером: добавление ещё одной
  # платформенной задачи в стадию "build" автоматически задерживает эту публикацию.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
