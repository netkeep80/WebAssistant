stages:
  - utility-tasks
  - package

create-gitlab-variables:
  stage: utility-tasks
  script:
    - |
      set -eu

      : "${CI_PROJECT_ACCESS_TOKEN:?CI_PROJECT_ACCESS_TOKEN is required}"
      : "${CI_API_V4_URL:?CI_API_V4_URL is required}"
      : "${CI_PROJECT_ID:?CI_PROJECT_ID is required}"

      create_project_variable_if_missing() {
        key="$1"
        initial_value="$2"
        response_file="$(mktemp)"

        status="$(
          curl --silent --show-error             --output "$response_file"             --write-out "%{http_code}"             --header "PRIVATE-TOKEN: $CI_PROJECT_ACCESS_TOKEN"             "$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables/$key"
        )"

        case "$status" in
          200)
            echo "GitLab project variable already exists: $key"
            ;;
          404)
            curl --silent --show-error --fail               --request POST               --header "PRIVATE-TOKEN: $CI_PROJECT_ACCESS_TOKEN"               "$CI_API_V4_URL/projects/$CI_PROJECT_ID/variables"               --form "key=$key"               --form "protected=true"               --form "expanded=true"               --form "value=$initial_value"               >/dev/null
            echo "GitLab project variable created: $key"
            ;;
          *)
            echo "Unable to inspect GitLab project variable $key: HTTP $status" >&2
            cat "$response_file" >&2
            rm -f "$response_file"
            exit 1
            ;;
        esac

        rm -f "$response_file"
      }

      create_project_variable_if_missing CI_NETWORK_DRIVE_PATH null
      create_project_variable_if_missing CI_DISTRIBUTION_NAME null
  only:
    refs:
      - master
      - main
  when: manual

linux-package:
  stage: package
  script:
    - 'export WEBASSISTANT_SOURCE_SHA="$CI_COMMIT_SHA"'
    - './build/linux/package.sh artifacts/linux-x64'
  artifacts:
    # Временный transport/debug artifact. Долговременное distribution storage
    # принадлежит внешней downstream CI/CD configuration.
    paths:
      - artifacts/linux-x64/
    expire_in: 1 day
  only:
    changes:
      - ".gitlab-ci.yml"
      - "README.md"
      - "VERSION"
      - "WebAssistant.sln"
      - "NuGet.Config"
      - "src/**/*"
      - "build/**/*"
      - "install/**/*"
      - "docs/**/*"
      - "vendor/**/*"
