name: Temporary release fixture version sync

on:
  push:
    branches:
      - feature/163-scanner-api-stable-id-auto
    paths:
      - .github/workflows/tmp-sync-release-fixture-version.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/163-scanner-api-stable-id-auto
          fetch-depth: 0
      - name: Synchronize fixed release test fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/core/ReleaseInfrastructureTests.cs')
          text = path.read_text(encoding='utf-8')
          old = '0.3.21'
          new = '0.3.22'
          count = text.count(old)
          if count == 0:
              raise SystemExit('expected v0.3.21 fixture literals were not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print(f'replaced {count} fixture literal occurrence(s)')
          PY
          git diff --check
          git diff -- tests/core/ReleaseInfrastructureTests.cs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/core/ReleaseInfrastructureTests.cs
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize release test fixture with 0.3.22"
          git push origin HEAD:feature/163-scanner-api-stable-id-auto
