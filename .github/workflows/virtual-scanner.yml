name: virtual scanner

on:
  workflow_call:
    inputs:
      run_linux:
        description: Run Linux SANE direct-SDK acceptance.
        required: false
        type: boolean
        default: true
      run_windows:
        description: Run Windows TWAIN direct-SDK acceptance.
        required: false
        type: boolean
        default: true
      source_ref:
        description: Exact commit/ref to test when called by top-level CI.
        required: false
        type: string
        default: ''
      mode:
        description: Scanner evidence mode (smoke or full).
        required: false
        type: string
        default: full
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'tests/virtual-scanner/**'
      - 'tests/core/LinuxVirtualScanAdapterTests.cs'
      - 'tests/core/WindowsScanAdapterTests.cs'
      - 'tests/core/PlatformEndToEndTests.cs'
      - 'tests/core/VirtualScannerWorkflowTests.cs'
      - 'webassist/vendor/**'
      - 'webassist/NuGet.Config'
      - 'webassist/src/WebAssistant/Scanning/**'
      - 'webassist/src/WebAssistant/WebAssistant.csproj'
      - '.github/workflows/virtual-scanner.yml'

permissions:
  contents: read

jobs:
  resolve-inputs:
    name: Resolve scanner evidence inputs
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      run_linux: ${{ steps.resolve.outputs.run_linux }}
      run_windows: ${{ steps.resolve.outputs.run_windows }}
    steps:
      - name: Resolve fail-closed mode and exact source ref
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_RUN_LINUX: ${{ inputs.run_linux }}
          INPUT_RUN_WINDOWS: ${{ inputs.run_windows }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'push' ]]; then
            mode=full
            source_ref="$GITHUB_SHA"
            run_linux=true
            run_windows=true
          else
            mode="$INPUT_MODE"
            source_ref="${INPUT_SOURCE_REF:-$GITHUB_SHA}"
            run_linux="$INPUT_RUN_LINUX"
            run_windows="$INPUT_RUN_WINDOWS"
          fi

          case "$mode" in
            smoke|full) ;;
            *)
              echo "virtual-scanner: invalid mode: $mode" >&2
              exit 1
              ;;
          esac

          for flag in "$run_linux" "$run_windows"; do
            case "$flag" in
              true|false) ;;
              *)
                echo "virtual-scanner: invalid platform flag: $flag" >&2
                exit 1
                ;;
            esac
          done

          [[ -n "$source_ref" ]] || {
            echo 'virtual-scanner: empty source_ref' >&2
            exit 1
          }

          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
          printf 'source_ref=%s\n' "$source_ref" >> "$GITHUB_OUTPUT"
          printf 'run_linux=%s\n' "$run_linux" >> "$GITHUB_OUTPUT"
          printf 'run_windows=%s\n' "$run_windows" >> "$GITHUB_OUTPUT"

  linux-sane-test:
    needs: resolve-inputs
    if: ${{ (github.event_name == 'push' || inputs.run_linux) && needs.resolve-inputs.outputs.run_linux == 'true' }}
    name: Linux SANE direct SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-inputs.outputs.source_ref }}

      - name: Install SANE and GTK runtime
        shell: bash
        run: |
          set -euo pipefail
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          [[ -f "$ubuntu_sources" ]] || {
            echo "Ubuntu apt source definition is missing: $ubuntu_sources" >&2
            exit 1
          }

          apt_options=(
            -o "Dir::Etc::sourcelist=$ubuntu_sources"
            -o "Dir::Etc::sourceparts=-"
            -o "APT::Get::List-Cleanup=0"
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y sane-utils libgtk-3-0t64

      - name: Verify SANE test backend
        shell: bash
        run: tests/virtual-scanner/linux/run-sane-test.sh

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Rebuild candidate repository-owned SDK
        shell: bash
        run: webassist/vendor/naps2/rebuild-fixed-sdk.sh

      - name: Upload candidate repository-owned SDK
        uses: actions/upload-artifact@v4
        with:
          name: webassistant-naps2-sdk-candidate
          path: webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.2.450cba65.nupkg
          if-no-files-found: error
          retention-days: 1

      - name: Prepare isolated SANE configuration
        shell: bash
        run: |
          set -euo pipefail
          SANE_CONFIG="$RUNNER_TEMP/sane-config"
          rm -rf -- "$SANE_CONFIG"
          mkdir -p -- "$SANE_CONFIG"
          printf 'test\n' > "$SANE_CONFIG/dll.conf"
          SANE_CONFIG_DIR="$SANE_CONFIG" scanimage -L

      - name: Test LinuxScanAdapter acquisition
        shell: bash
        env:
          WEBASSISTANT_LINUX_VIRTUAL: '1'
          SANE_CONFIG_DIR: ${{ runner.temp }}/sane-config
        run: dotnet test tests/core/WebAssistant.CoreTests.csproj --configuration Release --filter "Category=LinuxVirtualScanner"

      - name: Test Linux HTTP end-to-end
        if: ${{ needs.resolve-inputs.outputs.mode == 'full' }}
        shell: bash
        env:
          WEBASSISTANT_PLATFORM_E2E: '1'
          SANE_CONFIG_DIR: ${{ runner.temp }}/sane-config
        run: dotnet test tests/core/WebAssistant.CoreTests.csproj --configuration Release --filter "Category=PlatformVirtualEndToEnd"

      - name: Assert repository-owned SDK feed exists
        shell: bash
        run: test -n "$(find webassist/vendor/nuget -maxdepth 1 -type f -name 'WebAssistant.NAPS2.Sdk.*.nupkg' -print -quit)"

  windows-twain-test:
    needs: resolve-inputs
    if: ${{ (github.event_name == 'push' || inputs.run_windows) && needs.resolve-inputs.outputs.run_windows == 'true' }}
    name: Windows TWAIN direct SDK
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-inputs.outputs.source_ref }}

      - name: Install official TWAIN sample source
        shell: pwsh
        run: tests/virtual-scanner/windows/install-twain-sample.ps1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test WindowsScanAdapter acquisition
        shell: pwsh
        env:
          WEBASSISTANT_WINDOWS_VIRTUAL: '1'
        run: dotnet test tests/core/WebAssistant.CoreTests.csproj --configuration Release --filter "Category=WindowsVirtualScanner"

      - name: Test Windows HTTP end-to-end
        if: ${{ needs.resolve-inputs.outputs.mode == 'full' }}
        shell: pwsh
        env:
          WEBASSISTANT_PLATFORM_E2E: '1'
        run: dotnet test tests/core/WebAssistant.CoreTests.csproj --configuration Release --filter "Category=PlatformVirtualEndToEnd"

      - name: Assert repository-owned SDK feed exists
        shell: pwsh
        run: |
          $package = Get-ChildItem webassist/vendor/nuget -Filter 'WebAssistant.NAPS2.Sdk.*.nupkg' | Select-Object -First 1
          if (-not $package) { throw 'Repository-owned WebAssistant NAPS2 SDK package is missing.' }
