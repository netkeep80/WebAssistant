name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: webassistant-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# cancellation-probe: 4

jobs:
  requirements:
    name: CI requirements
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.required.outputs.core }}
      linux_systemd: ${{ steps.required.outputs.linux_systemd }}
      windows_service: ${{ steps.required.outputs.windows_service }}
      virtual_scanner: ${{ steps.required.outputs.virtual_scanner }}
    steps:
      - name: Declare conservative baseline requirements
        id: required
        shell: bash
        run: |
          {
            echo 'core=true'
            echo 'linux_systemd=true'
            echo 'windows_service=true'
            echo 'virtual_scanner=true'
          } >> "$GITHUB_OUTPUT"

  core:
    name: core
    needs: requirements
    if: ${{ needs.requirements.outputs.core == 'true' }}
    uses: ./.github/workflows/core.yml

  linux-systemd:
    name: ALT Linux systemd acceptance
    needs: requirements
    if: ${{ needs.requirements.outputs.linux_systemd == 'true' }}
    uses: ./.github/workflows/linux-systemd.yml

  windows-service:
    name: Windows Service acceptance
    needs: requirements
    if: ${{ needs.requirements.outputs.windows_service == 'true' }}
    uses: ./.github/workflows/windows-service.yml

  virtual-scanner:
    name: virtual scanner
    needs: requirements
    if: ${{ needs.requirements.outputs.virtual_scanner == 'true' }}
    uses: ./.github/workflows/virtual-scanner.yml

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs:
      - requirements
      - core
      - linux-systemd
      - windows-service
      - virtual-scanner
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate fail-closed product CI verdict
        shell: bash
        env:
          REQUIREMENTS_RESULT: ${{ needs.requirements.result }}
          CORE_REQUIRED: ${{ needs.requirements.outputs.core }}
          CORE_RESULT: ${{ needs.core.result }}
          LINUX_SYSTEMD_REQUIRED: ${{ needs.requirements.outputs.linux_systemd }}
          LINUX_SYSTEMD_RESULT: ${{ needs.linux-systemd.result }}
          WINDOWS_SERVICE_REQUIRED: ${{ needs.requirements.outputs.windows_service }}
          WINDOWS_SERVICE_RESULT: ${{ needs.windows-service.result }}
          VIRTUAL_SCANNER_REQUIRED: ${{ needs.requirements.outputs.virtual_scanner }}
          VIRTUAL_SCANNER_RESULT: ${{ needs.virtual-scanner.result }}
        run: |
          set -euo pipefail

          check_result() {
            local name="$1"
            local required="$2"
            local result="$3"

            case "$required" in
              true|false) ;;
              *)
                echo "ci-required: invalid requirement flag for $name: $required" >&2
                return 1
                ;;
            esac

            case "$result" in
              success|skipped|failure|cancelled) ;;
              *)
                echo "ci-required: unknown result for $name: $result" >&2
                return 1
                ;;
            esac

            case "$required:$result" in
              true:success|false:success|false:skipped) return 0 ;;
              *)
                echo "ci-required: $name required=$required result=$result" >&2
                return 1
                ;;
            esac
          }

          assert_case() {
            local required="$1"
            local result="$2"
            local expected="$3"
            local actual

            if check_result self-test "$required" "$result" >/dev/null 2>&1; then
              actual=pass
            else
              actual=fail
            fi

            if [[ "$actual" != "$expected" ]]; then
              echo "ci-required self-test mismatch: required=$required result=$result expected=$expected actual=$actual" >&2
              exit 1
            fi
          }

          assert_case true success pass
          assert_case true skipped fail
          assert_case true failure fail
          assert_case true cancelled fail
          assert_case false success pass
          assert_case false skipped pass
          assert_case false failure fail
          assert_case false cancelled fail
          assert_case false unknown fail
          assert_case invalid success fail

          if [[ "$REQUIREMENTS_RESULT" != 'success' ]]; then
            echo "ci-required: requirements job result=$REQUIREMENTS_RESULT" >&2
            exit 1
          fi

          failures=0
          check_result core "$CORE_REQUIRED" "$CORE_RESULT" || failures=1
          check_result linux-systemd "$LINUX_SYSTEMD_REQUIRED" "$LINUX_SYSTEMD_RESULT" || failures=1
          check_result windows-service "$WINDOWS_SERVICE_REQUIRED" "$WINDOWS_SERVICE_RESULT" || failures=1
          check_result virtual-scanner "$VIRTUAL_SCANNER_REQUIRED" "$VIRTUAL_SCANNER_RESULT" || failures=1

          if [[ "$failures" -ne 0 ]]; then
            echo 'ci-required: FAIL' >&2
            exit 1
          fi

          echo 'ci-required: PASS'
