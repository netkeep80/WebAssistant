name: core

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit/ref to test when called by top-level CI.
        required: false
        type: string
        default: ''
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/core/WebAssistant.CoreTests.csproj --configuration Release
