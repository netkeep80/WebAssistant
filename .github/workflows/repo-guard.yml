name: repo-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  repo-guard:
    name: repo-guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run repo-guard
        id: repo_guard
        uses: netkeep80/repo-guard@8226c2fae7db07679ffe73d1b6a6837d9a1b424d
        with:
          mode: check-pr
          enforcement: blocking
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish repo-guard summary
        if: always()
        shell: bash
        run: |
          echo "repo-guard: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
