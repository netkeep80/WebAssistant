name: C3.10 isolated proof migration

on:
  push:
    branches:
      - c3.10-proof/203-version-consumer

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c3.10-proof/203-version-consumer

      - name: Migrate proof policy and version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('repo-policy.json')
          policy = json.loads(path.read_text(encoding='utf-8'))
          integration = policy.pop('integration', None)
          if not isinstance(integration, dict):
              raise SystemExit('expected retired top-level integration in proof BASE')

          relations = policy.setdefault('document_relations', {})
          documents = relations.setdefault('documents', {})
          rules = relations.setdefault('rules', [])

          if 'repo-guard-workflow' in documents:
              raise SystemExit('repo-guard-workflow document already exists')
          documents['repo-guard-workflow'] = {
              'path': '.github/workflows/repo-guard.yml',
              'format': 'yaml',
          }

          existing_ids = {rule.get('id') for rule in rules if isinstance(rule, dict)}
          new_rules = [
              {
                  'id': 'repo-guard-workflow-action-pin',
                  'kind': 'scalar_equals_literal',
                  'source': {
                      'document': 'repo-guard-workflow',
                      'pointer': '/jobs/repo-guard/steps/1/uses',
                      'type': 'string',
                  },
                  'value': 'netkeep80/repo-guard@e5b9063c9d1c9e05404ec32b78ca005c278839ce',
              },
              {
                  'id': 'repo-guard-workflow-mode',
                  'kind': 'scalar_equals_literal',
                  'source': {
                      'document': 'repo-guard-workflow',
                      'pointer': '/jobs/repo-guard/steps/1/with/mode',
                      'type': 'string',
                  },
                  'value': 'check-pr',
              },
              {
                  'id': 'repo-guard-workflow-enforcement',
                  'kind': 'scalar_equals_literal',
                  'source': {
                      'document': 'repo-guard-workflow',
                      'pointer': '/jobs/repo-guard/steps/1/with/enforcement',
                      'type': 'string',
                  },
                  'value': 'blocking',
              },
              {
                  'id': 'repo-guard-workflow-permission-contents',
                  'kind': 'scalar_equals_literal',
                  'source': {
                      'document': 'repo-guard-workflow',
                      'pointer': '/permissions/contents',
                      'type': 'string',
                  },
                  'value': 'read',
              },
              {
                  'id': 'repo-guard-workflow-permission-pull-requests',
                  'kind': 'scalar_equals_literal',
                  'source': {
                      'document': 'repo-guard-workflow',
                      'pointer': '/permissions/pull-requests',
                      'type': 'string',
                  },
                  'value': 'read',
              },
              {
                  'id': 'repo-guard-workflow-permission-issues',
                  'kind': 'scalar_equals_literal',
                  'source': {
                      'document': 'repo-guard-workflow',
                      'pointer': '/permissions/issues',
                      'type': 'string',
                  },
                  'value': 'read',
              },
          ]
          collisions = [rule['id'] for rule in new_rules if rule['id'] in existing_ids]
          if collisions:
              raise SystemExit(f'duplicate document relation ids: {collisions}')
          rules.extend(new_rules)

          version_rule = next((r for r in rules if r.get('id') == 'product-version-monotonic'), None)
          expected = {
              'id': 'product-version-monotonic',
              'kind': 'scalar_strictly_greater',
              'comparator': 'semver',
              'left': {
                  'document': 'head-product-version',
                  'pointer': '',
                  'type': 'string',
              },
              'right': {
                  'document': 'base-product-version',
                  'pointer': '',
                  'type': 'string',
              },
          }
          if version_rule != expected:
              raise SystemExit('existing product-version-monotonic relation changed unexpectedly')

          path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          version = Path('webassist/VERSION')
          if version.read_text(encoding='utf-8').strip() != '0.3.22':
              raise SystemExit('proof BASE VERSION is not 0.3.22')
          version.write_text('0.3.23\n', encoding='utf-8')
          PY

          rm .github/workflows/c3-10-proof-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo-policy.json webassist/VERSION .github/workflows/c3-10-proof-migrate.yml
          git commit -m 'test(repo-guard): migrate isolated version consumer to final vocabulary'
          git push origin HEAD:c3.10-proof/203-version-consumer
