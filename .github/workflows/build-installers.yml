name: Build installers

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit SHA whose product root is packaged.
        required: true
        type: string
      run_linux:
        description: Build the canonical Linux installer artifact.
        required: true
        type: boolean
      run_windows:
        description: Build the canonical Windows installer artifact.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-linux-installer:
    name: Build Linux installer artifact once
    if: ${{ inputs.run_linux }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Ensure ZIP builder dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Create isolated product export root
        shell: bash
        run: |
          set -euo pipefail
          export_root="$RUNNER_TEMP/webassistant-linux-export-root"
          rm -rf -- "$export_root"
          mkdir -p -- "$export_root"
          cp -a "$GITHUB_WORKSPACE/webassist/." "$export_root/"

          test -f "$export_root/WebAssistant.sln"
          test -f "$export_root/.gitlab-ci.yml"
          test -f "$export_root/README.md"
          test -f "$export_root/VERSION"
          test -x "$export_root/build/linux/package.sh"
          test -f "$export_root/build/common/default-appsettings.json"
          test -f "$export_root/build/common/write-provenance.sh"

          echo "WEBASSISTANT_EXPORT_ROOT=$export_root" >> "$GITHUB_ENV"

      - name: Build canonical versioned ZIP and evidence
        shell: bash
        env:
          WEBASSISTANT_SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/webassistant-linux-artifacts"
          rm -rf -- "$output_root"
          mkdir -p -- "$output_root"
          "$WEBASSISTANT_EXPORT_ROOT/build/linux/package.sh" "$output_root"

          version="$(tr -d '\r\n' < "$WEBASSISTANT_EXPORT_ROOT/VERSION")"
          artifact="$output_root/WebAssistant-linux-x64-${version}.zip"
          test -f "$artifact"
          test -f "${artifact}.sha256"
          test -f "${artifact}.provenance.json"

      - name: Upload immutable Linux installer bytes
        uses: actions/upload-artifact@v4
        with:
          name: webassistant-linux-installer-${{ inputs.source_ref }}
          path: |
            ${{ runner.temp }}/webassistant-linux-artifacts/WebAssistant-linux-x64-*.zip
            ${{ runner.temp }}/webassistant-linux-artifacts/WebAssistant-linux-x64-*.zip.sha256
            ${{ runner.temp }}/webassistant-linux-artifacts/WebAssistant-linux-x64-*.zip.provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup Linux producer workspace
        if: always()
        shell: bash
        run: |
          set +e
          [[ -z "${WEBASSISTANT_EXPORT_ROOT:-}" ]] || rm -rf -- "$WEBASSISTANT_EXPORT_ROOT"
          rm -rf -- "$RUNNER_TEMP/webassistant-linux-artifacts"

  build-windows-installer:
    name: Build Windows installer artifact once
    if: ${{ inputs.run_windows }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Create isolated product export root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'webassist'
          $exportRoot = Join-Path $env:RUNNER_TEMP 'webassistant-windows-export-root'

          if (Test-Path -LiteralPath $exportRoot) {
              Remove-Item -LiteralPath $exportRoot -Recurse -Force
          }
          New-Item -Path $exportRoot -ItemType Directory -Force | Out-Null
          Get-ChildItem -LiteralPath $source -Force |
              Copy-Item -Destination $exportRoot -Recurse -Force

          $required = @(
              'WebAssistant.sln',
              '.gitlab-ci.yml',
              'README.md',
              'VERSION',
              'build/common/default-appsettings.json',
              'build/common/write-provenance.ps1',
              'build/windows/package.bat',
              'build/windows/package.ps1',
              'build/windows/upgrade-preflight/WebAssistant.UpgradePreflight.csproj',
              'build/windows/installer/WebAssistant.Package.wixproj',
              'build/windows/installer/WebAssistant.Bundle.wixproj'
          )
          foreach ($relativePath in $required) {
              if (-not (Test-Path -LiteralPath (Join-Path $exportRoot $relativePath) -PathType Leaf)) {
                  throw "Isolated export root is missing $relativePath"
              }
          }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "WEBASSISTANT_EXPORT_ROOT=$exportRoot"

      - name: Build canonical versioned EXE and evidence
        shell: pwsh
        env:
          WEBASSISTANT_SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'webassistant-windows-artifacts'
          if (Test-Path -LiteralPath $outputRoot) {
              Remove-Item -LiteralPath $outputRoot -Recurse -Force
          }
          New-Item -Path $outputRoot -ItemType Directory -Force | Out-Null

          $packageBatch = Join-Path $env:WEBASSISTANT_EXPORT_ROOT 'build/windows/package.bat'
          & $packageBatch -OutputDirectory $outputRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Canonical Windows producer failed with exit code $LASTEXITCODE."
          }

          $version = (Get-Content -LiteralPath (Join-Path $env:WEBASSISTANT_EXPORT_ROOT 'VERSION') -Raw).Trim()
          $artifact = Join-Path $outputRoot "WebAssistant-win-x64-$version.exe"
          foreach ($requiredPath in @($artifact, "$artifact.sha256", "$artifact.provenance.json")) {
              if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
                  throw "Canonical Windows producer did not create $requiredPath"
              }
          }

      - name: Upload immutable Windows installer bytes
        uses: actions/upload-artifact@v4
        with:
          name: webassistant-windows-installer-${{ inputs.source_ref }}
          path: |
            ${{ runner.temp }}/webassistant-windows-artifacts/WebAssistant-win-x64-*.exe
            ${{ runner.temp }}/webassistant-windows-artifacts/WebAssistant-win-x64-*.exe.sha256
            ${{ runner.temp }}/webassistant-windows-artifacts/WebAssistant-win-x64-*.exe.provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup Windows producer workspace
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:WEBASSISTANT_EXPORT_ROOT -and (Test-Path -LiteralPath $env:WEBASSISTANT_EXPORT_ROOT)) {
              Remove-Item -LiteralPath $env:WEBASSISTANT_EXPORT_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          }
          $outputRoot = Join-Path $env:RUNNER_TEMP 'webassistant-windows-artifacts'
          if (Test-Path -LiteralPath $outputRoot) {
              Remove-Item -LiteralPath $outputRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
