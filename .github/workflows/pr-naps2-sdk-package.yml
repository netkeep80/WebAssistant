name: pr-naps2-sdk-package

on:
  pull_request:
    paths:
      - "webassist/vendor/naps2/rebuild-fixed-sdk.sh"
      - ".github/workflows/pr-naps2-sdk-package.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Rebuild repository-owned NAPS2 SDK
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          chmod +x webassist/vendor/naps2/rebuild-fixed-sdk.sh
          cd webassist
          ./vendor/naps2/rebuild-fixed-sdk.sh
          sha256sum vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.4.450cba65.nupkg

      - name: Commit exact generated package to PR branch
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f "$PR_BRANCH" HEAD
          git checkout "$PR_BRANCH"
          git add webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.4.450cba65.nupkg
          if git diff --cached --quiet; then
            echo "Exact .4 package is already committed."
            exit 0
          fi
          git commit -m "#191: add reproducible NAPS2 SDK .4 package"
          git push origin "HEAD:$PR_BRANCH"

      - name: Upload exact package
        uses: actions/upload-artifact@v4
        with:
          name: webassistant-naps2-sdk-4-${{ github.event.pull_request.head.sha }}
          path: webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.4.450cba65.nupkg
          if-no-files-found: error
