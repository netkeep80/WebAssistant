name: temp-rebuild-naps2-241

on:
  push:
    branches:
      - issue-241-observability-followup

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Rebuild repository-owned NAPS2 packages
        run: bash webassist/vendor/naps2/rebuild-fixed-sdk.sh

      - name: Pin generated SDK fingerprint
        shell: bash
        run: |
          set -euo pipefail
          package="webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.6.450cba65.nupkg"
          sha="$(sha256sum "$package" | awk '{print $1}')"
          size="$(stat -c '%s' "$package")"
          python3 - "$sha" "$size" <<'PY'
          import pathlib
          import sys

          sha, size = sys.argv[1], sys.argv[2]
          for name in [
              "tests/core/DependencyOwnershipTests.cs",
              "webassist/vendor/naps2/README.md",
          ]:
              path = pathlib.Path(name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("__SDK_SHA256__", sha)
              text = text.replace("__SDK_SIZE__", size)
              path.write_text(text, encoding="utf-8")
          print(f"SDK_SHA256={sha}")
          print(f"SDK_SIZE={size}")
          PY

      - name: Commit generated package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.6.450cba65.nupkg             tests/core/DependencyOwnershipTests.cs             webassist/vendor/naps2/README.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "#241: rebuild fixed NAPS2 SDK .6"
          git push origin "HEAD:${GITHUB_REF_NAME}"
