name: NAPS2 SDK .4 bootstrap

on:
  push:
    branches:
      - test/191-naps2-runtime-integrity-red
    paths:
      - 'webassist/vendor/naps2/rebuild-fixed-sdk.sh'
      - '.github/workflows/naps2-sdk-bootstrap.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Rebuild NAPS2 .4 twice reproducibly
        shell: bash
        run: |
          set -euo pipefail
          cd webassist

          package='vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.4.450cba65.nupkg'
          previous='vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.3.450cba65.nupkg'
          previous_sha='e8abde3b7bd7e756eea714883c6e6ed79c6bb5f5052cd630b3dc763e45a50915'
          first="$RUNNER_TEMP/WebAssistant.NAPS2.Sdk.4.first.nupkg"

          test "$(sha256sum "$previous" | awk '{print $1}')" = "$previous_sha"

          ./vendor/naps2/rebuild-fixed-sdk.sh
          first_sha="$(sha256sum "$package" | awk '{print $1}')"
          first_size="$(stat -c '%s' "$package")"
          cp -- "$package" "$first"

          ./vendor/naps2/rebuild-fixed-sdk.sh
          second_sha="$(sha256sum "$package" | awk '{print $1}')"
          second_size="$(stat -c '%s' "$package")"

          echo "naps2_sdk_4_sha256=$second_sha"
          echo "naps2_sdk_4_size=$second_size"

          test "$first_sha" = "$second_sha"
          test "$first_size" = "$second_size"
          cmp --silent "$first" "$package"
          test "$second_size" -lt 1048576
          test "$(sha256sum "$previous" | awk '{print $1}')" = "$previous_sha"

      - name: Commit immutable .4 package to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail

          package='webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.4.450cba65.nupkg'
          remote_head="$(git ls-remote origin refs/heads/test/191-naps2-runtime-integrity-red | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$package"
          git diff --cached --exit-code && {
            echo 'Expected new .4 package was not added.' >&2
            exit 1
          }

          git commit -m '#191: vendor immutable NAPS2 SDK .4 package'
          git push origin HEAD:refs/heads/test/191-naps2-runtime-integrity-red
