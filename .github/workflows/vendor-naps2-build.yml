name: vendor-naps2-build

on:
  push:
    branches:
      - issue-241-observability-red
    paths:
      - webassist/vendor/naps2/rebuild-fixed-sdk.sh
      - .github/workflows/vendor-naps2-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Rebuild repository-owned NAPS2 packages
        working-directory: webassist
        run: ./vendor/naps2/rebuild-fixed-sdk.sh
      - name: Upload rebuilt packages
        uses: actions/upload-artifact@v4
        with:
          name: naps2-observability-packages
          if-no-files-found: error
          path: |
            webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.1.3.0-webassistant.5.450cba65.nupkg
            webassist/vendor/nuget/WebAssistant.NAPS2.Sdk.Worker.Win32.1.3.0-webassistant.2.450cba65.nupkg
